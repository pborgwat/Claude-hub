<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>🐕 Teckel vs Appels 🍎</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: none;
        }

        body {
            background: linear-gradient(135deg, #2d5016 0%, #4a7c23 50%, #2d5016 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            padding: 10px;
        }

        h1 {
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            margin-bottom: 10px;
            font-size: clamp(1.2rem, 5vw, 1.8rem);
            text-align: center;
        }

        #score {
            color: #fff;
            font-size: clamp(1rem, 4vw, 1.4rem);
            margin-bottom: 10px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        #gameCanvas {
            border: 4px solid #8B4513;
            border-radius: 10px;
            background: #90EE90;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            max-width: 100%;
            max-height: 60vh;
        }

        #controls {
            margin-top: 15px;
            color: #fff;
            text-align: center;
            font-size: clamp(0.8rem, 3vw, 1rem);
            opacity: 0.9;
        }

        .controls-row {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-top: 10px;
        }

        #startBtn {
            padding: 15px 20px;
            font-size: clamp(0.9rem, 3.5vw, 1.1rem);
            background: linear-gradient(145deg, #8B4513, #A0522D);
            color: white;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.2s, box-shadow 0.2s;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            line-height: 1.3;
        }

        #startBtn:active {
            transform: scale(0.95);
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        #gameOver {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.85);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            color: white;
            z-index: 100;
        }

        #gameOver h2 {
            font-size: clamp(1.5rem, 6vw, 2rem);
            margin-bottom: 15px;
        }

        #finalScore {
            font-size: clamp(1.2rem, 5vw, 1.5rem);
            margin-bottom: 20px;
        }

        .dpad {
            display: grid;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(3, 60px);
            gap: 5px;
            margin-top: 15px;
        }

        .dpad-btn {
            width: 60px;
            height: 60px;
            border: none;
            border-radius: 10px;
            background: rgba(255,255,255,0.2);
            color: white;
            font-size: 24px;
            cursor: pointer;
            transition: background 0.1s;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        .dpad-btn:active {
            background: rgba(255,255,255,0.4);
        }

        .dpad-btn.empty {
            background: transparent;
            cursor: default;
        }

        #highscores {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            padding: 10px 15px;
            border-radius: 10px;
            color: white;
            font-size: 0.85rem;
            max-width: 160px;
        }

        #highscores h3 {
            margin-bottom: 8px;
            font-size: 0.9rem;
            text-align: center;
        }

        #highscores ol {
            margin: 0;
            padding-left: 20px;
        }

        #highscores li {
            margin: 3px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #shareBtn {
            margin-top: 10px;
            padding: 6px 12px;
            font-size: 0.75rem;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            -webkit-tap-highlight-color: transparent;
        }

        #shareBtn:active {
            background: #45a049;
        }

        #shareStatus {
            font-size: 0.7rem;
            margin-top: 5px;
            opacity: 0.8;
            text-align: center;
        }

        #nameInput {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            color: white;
            z-index: 110;
        }

        #nameInput h2 {
            color: #FFD700;
            margin-bottom: 10px;
        }

        #nameInput p {
            margin-bottom: 15px;
        }

        #nameInput input {
            padding: 10px 15px;
            font-size: 1.1rem;
            border: none;
            border-radius: 10px;
            width: 180px;
            text-align: center;
            margin-bottom: 15px;
        }

        #nameInput button {
            padding: 12px 30px;
            font-size: 1rem;
            background: #8B4513;
            color: white;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body>
    <h1>🐕 Teckel vs Appels 🍎</h1>
    <div id="score">Appels: 0</div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <div id="controls">
        <p>Swipe of gebruik de knoppen om te bewegen</p>
        <div class="controls-row">
            <div class="dpad">
                <div class="dpad-btn empty"></div>
                <button class="dpad-btn" id="upBtn">⬆️</button>
                <div class="dpad-btn empty"></div>
                <button class="dpad-btn" id="leftBtn">⬅️</button>
                <div class="dpad-btn empty"></div>
                <button class="dpad-btn" id="rightBtn">➡️</button>
                <div class="dpad-btn empty"></div>
                <button class="dpad-btn" id="downBtn">⬇️</button>
                <div class="dpad-btn empty"></div>
            </div>
            <button id="startBtn">🐕<br>Start<br>🍎</button>
        </div>
    </div>

    <div id="highscores">
        <h3>🏆 Highscores</h3>
        <ol id="highscoreList"></ol>
        <button id="shareBtn">📤 Deel scorebord</button>
        <div id="shareStatus"></div>
    </div>

    <div id="gameOver">
        <h2>Game Over! 🐕</h2>
        <p id="finalScore">Je teckel at 0 appels!</p>
        <button id="restartBtn" style="margin-top:15px; padding:12px 30px; font-size:1.1rem; background:#8B4513; color:white; border:none; border-radius:20px; cursor:pointer;">
            Opnieuw Spelen
        </button>
    </div>

    <div id="nameInput">
        <h2>🎉 Nieuwe Highscore!</h2>
        <p id="newScoreText">Je scoorde 0 punten!</p>
        <input type="text" id="playerName" placeholder="Je naam" maxlength="12">
        <br>
        <button id="saveScoreBtn">Opslaan</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Responsive canvas sizing
        function resizeCanvas() {
            const maxSize = Math.min(window.innerWidth - 30, window.innerHeight * 0.55, 400);
            canvas.style.width = maxSize + 'px';
            canvas.style.height = maxSize + 'px';
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let dachshund = [];
        let direction = { x: 1, y: 0 };
        let nextDirection = { x: 1, y: 0 };
        let apple = { x: 15, y: 15 };
        let score = 0;
        let gameRunning = false;
        let gameLoop;
        let speed = 150;

        // Gedeelde Highscore functies via jsonblob.com
        const MAX_HIGHSCORES = 5;
        const JSONBLOB_API = 'https://jsonblob.com/api/jsonBlob';
        let blobId = null;
        let cachedScores = [];

        // Haal blob ID uit URL of localStorage
        function initBlobId() {
            const urlParams = new URLSearchParams(window.location.search);
            blobId = urlParams.get('scores') || localStorage.getItem('teckelBlobId');
            updateShareStatus();
        }

        function updateShareStatus() {
            const status = document.getElementById('shareStatus');
            if (blobId) {
                status.textContent = '🌐 Gedeeld scorebord actief';
            } else {
                status.textContent = '📱 Lokale scores';
            }
        }

        // Haal scores op (online of lokaal)
        async function getHighscores() {
            if (blobId) {
                try {
                    const response = await fetch(`${JSONBLOB_API}/${blobId}`);
                    if (response.ok) {
                        const data = await response.json();
                        cachedScores = data.scores || [];
                        return cachedScores;
                    }
                } catch (e) {
                    console.log('Online scores niet beschikbaar, gebruik lokaal');
                }
            }
            // Fallback naar localStorage
            const stored = localStorage.getItem('teckelHighscores');
            cachedScores = stored ? JSON.parse(stored) : [];
            return cachedScores;
        }

        // Sla scores op (online of lokaal)
        async function saveHighscores(scores) {
            // Altijd lokaal opslaan als backup
            localStorage.setItem('teckelHighscores', JSON.stringify(scores));

            if (blobId) {
                try {
                    await fetch(`${JSONBLOB_API}/${blobId}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ scores })
                    });
                } catch (e) {
                    console.log('Kon niet online opslaan');
                }
            }
        }

        function isHighscore(newScore) {
            if (newScore === 0) return false;
            if (cachedScores.length < MAX_HIGHSCORES) return true;
            return newScore > cachedScores[cachedScores.length - 1].score;
        }

        async function addHighscore(name, newScore) {
            // Haal verse scores op voor we toevoegen
            const scores = await getHighscores();
            scores.push({ name: name || 'Anoniem', score: newScore });
            scores.sort((a, b) => b.score - a.score);
            if (scores.length > MAX_HIGHSCORES) {
                scores.length = MAX_HIGHSCORES;
            }
            cachedScores = scores;
            await saveHighscores(scores);
            displayHighscores(scores);
        }

        function displayHighscores(scores) {
            scores = scores || cachedScores;
            const list = document.getElementById('highscoreList');
            if (scores.length === 0) {
                list.innerHTML = '<li style="list-style:none;margin-left:-20px;opacity:0.7">Nog geen scores</li>';
            } else {
                list.innerHTML = scores.map(s =>
                    `<li>${s.name}: ${s.score}</li>`
                ).join('');
            }
        }

        // Maak een gedeeld scorebord aan
        async function createSharedScoreboard() {
            const status = document.getElementById('shareStatus');
            status.textContent = '⏳ Aanmaken...';

            try {
                // Haal huidige lokale scores op
                const localScores = localStorage.getItem('teckelHighscores');
                const scores = localScores ? JSON.parse(localScores) : [];

                // Maak nieuwe blob aan
                const response = await fetch(JSONBLOB_API, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ scores })
                });

                if (response.ok) {
                    // Haal blob ID uit response URL
                    const location = response.headers.get('Location') || response.headers.get('X-Blob-Id');
                    blobId = location ? location.split('/').pop() : null;

                    if (!blobId) {
                        // Probeer uit response body
                        const url = response.url;
                        blobId = url.split('/').pop();
                    }

                    if (blobId && blobId !== 'jsonBlob') {
                        localStorage.setItem('teckelBlobId', blobId);
                        shareLink();
                    } else {
                        throw new Error('Geen blob ID ontvangen');
                    }
                }
            } catch (e) {
                console.error(e);
                status.textContent = '❌ Fout bij aanmaken';
                setTimeout(updateShareStatus, 2000);
            }
        }

        // Deel de link
        function shareLink() {
            if (!blobId) {
                createSharedScoreboard();
                return;
            }

            const shareUrl = `${window.location.origin}${window.location.pathname}?scores=${blobId}`;
            const status = document.getElementById('shareStatus');

            if (navigator.share) {
                navigator.share({
                    title: '🐕 Teckel vs Appels',
                    text: 'Speel mee en probeer mijn highscore te verslaan!',
                    url: shareUrl
                }).then(() => {
                    status.textContent = '✅ Gedeeld!';
                }).catch(() => {
                    copyToClipboard(shareUrl, status);
                });
            } else {
                copyToClipboard(shareUrl, status);
            }
        }

        function copyToClipboard(text, status) {
            navigator.clipboard.writeText(text).then(() => {
                status.textContent = '✅ Link gekopieerd!';
                setTimeout(updateShareStatus, 3000);
            }).catch(() => {
                status.textContent = '📋 ' + text.split('?')[1];
            });
        }

        // Teckel kleuren
        const colors = {
            head: '#5D4037',      // Donkerbruin hoofd
            body: '#8D6E63',      // Lichter bruin lichaam
            belly: '#D7CCC8',     // Lichte buik
            nose: '#1a1a1a',      // Zwarte neus
            eye: '#000000'        // Zwart oog
        };

        function initGame() {
            // Start positie - midden van het veld
            dachshund = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 },
                { x: 7, y: 10 },
                { x: 6, y: 10 }
            ];
            direction = { x: 1, y: 0 };
            nextDirection = { x: 1, y: 0 };
            score = 0;
            speed = 150;
            updateScore();
            placeApple();
        }

        function placeApple() {
            let validPosition = false;
            while (!validPosition) {
                apple.x = Math.floor(Math.random() * tileCount);
                apple.y = Math.floor(Math.random() * tileCount);
                validPosition = !dachshund.some(segment =>
                    segment.x === apple.x && segment.y === apple.y
                );
            }
        }

        function drawApple() {
            const x = apple.x * gridSize;
            const y = apple.y * gridSize;
            const size = gridSize;

            // Appel tekenen
            ctx.font = `${size - 2}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🍎', x + size/2, y + size/2 + 2);
        }

        function drawDachshund() {
            dachshund.forEach((segment, index) => {
                const x = segment.x * gridSize;
                const y = segment.y * gridSize;
                const size = gridSize - 2;

                if (index === 0) {
                    // Teken het hoofd
                    drawHead(x, y, size);
                } else if (index === dachshund.length - 1) {
                    // Teken de staart
                    drawTail(x, y, size, index);
                } else {
                    // Teken het lichaam
                    drawBody(x, y, size);
                }
            });
        }

        function drawHead(x, y, size) {
            // Hoofd vorm
            ctx.fillStyle = colors.head;
            ctx.beginPath();
            ctx.roundRect(x + 1, y + 2, size, size - 4, 4);
            ctx.fill();

            // Snuit (langer voor teckel look)
            const dir = direction;
            let snoutX = x + size/2;
            let snoutY = y + size/2;

            if (dir.x === 1) snoutX = x + size - 2;
            else if (dir.x === -1) snoutX = x + 2;
            else if (dir.y === 1) snoutY = y + size - 2;
            else if (dir.y === -1) snoutY = y + 2;

            ctx.fillStyle = colors.head;
            ctx.beginPath();
            ctx.arc(snoutX, snoutY, 5, 0, Math.PI * 2);
            ctx.fill();

            // Neus
            ctx.fillStyle = colors.nose;
            ctx.beginPath();
            ctx.arc(snoutX, snoutY, 2, 0, Math.PI * 2);
            ctx.fill();

            // Ogen
            ctx.fillStyle = colors.eye;
            let eyeX = x + size/2;
            let eyeY = y + size/2 - 2;

            if (dir.x !== 0) {
                ctx.beginPath();
                ctx.arc(x + size/2, y + 5, 2, 0, Math.PI * 2);
                ctx.fill();
            } else {
                ctx.beginPath();
                ctx.arc(x + 5, y + size/2, 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(x + size - 5, y + size/2, 2, 0, Math.PI * 2);
                ctx.fill();
            }

            // Floppy oren
            ctx.fillStyle = '#4E342E';
            if (dir.x === 1 || dir.x === -1) {
                ctx.beginPath();
                ctx.ellipse(x + size/2, y + size - 2, 4, 6, 0, 0, Math.PI * 2);
                ctx.fill();
            } else {
                ctx.beginPath();
                ctx.ellipse(x + 2, y + size/2, 6, 4, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(x + size - 2, y + size/2, 6, 4, 0, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawBody(x, y, size) {
            // Langwerpig lichaam (typisch teckel)
            ctx.fillStyle = colors.body;
            ctx.beginPath();
            ctx.roundRect(x + 1, y + 3, size, size - 6, 3);
            ctx.fill();

            // Buik accent
            ctx.fillStyle = colors.belly;
            ctx.beginPath();
            ctx.roundRect(x + 3, y + size - 6, size - 4, 3, 1);
            ctx.fill();
        }

        function drawTail(x, y, size, index) {
            // Klein staartstukje
            ctx.fillStyle = colors.body;

            const prev = dachshund[index - 1];
            const tailDir = {
                x: prev.x - dachshund[index].x,
                y: prev.y - dachshund[index].y
            };

            ctx.beginPath();
            if (tailDir.x !== 0) {
                ctx.roundRect(x + 4, y + 5, size - 6, size - 10, 2);
            } else {
                ctx.roundRect(x + 5, y + 4, size - 10, size - 6, 2);
            }
            ctx.fill();

            // Staart puntje
            ctx.fillStyle = colors.head;
            ctx.beginPath();
            ctx.arc(x + size/2, y + size/2, 3, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawGrass() {
            ctx.fillStyle = '#90EE90';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Gras patroon
            ctx.fillStyle = '#7CCD7C';
            for (let i = 0; i < tileCount; i++) {
                for (let j = 0; j < tileCount; j++) {
                    if ((i + j) % 2 === 0) {
                        ctx.fillRect(i * gridSize, j * gridSize, gridSize, gridSize);
                    }
                }
            }
        }

        function update() {
            direction = { ...nextDirection };

            // Nieuwe kop positie
            const head = {
                x: dachshund[0].x + direction.x,
                y: dachshund[0].y + direction.y
            };

            // Check muur botsing
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                gameOver();
                return;
            }

            // Check zelf-botsing
            if (dachshund.some(segment => segment.x === head.x && segment.y === head.y)) {
                gameOver();
                return;
            }

            dachshund.unshift(head);

            // Check appel gegeten
            if (head.x === apple.x && head.y === apple.y) {
                score++;
                updateScore();
                placeApple();
                // Sneller worden
                if (speed > 80) {
                    speed -= 3;
                }
            } else {
                dachshund.pop();
            }
        }

        function draw() {
            drawGrass();
            drawApple();
            drawDachshund();
        }

        function gameStep() {
            update();
            draw();
        }

        function startGame() {
            if (gameRunning) return;

            initGame();
            gameRunning = true;
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('gameOver').style.display = 'none';

            function loop() {
                if (!gameRunning) return;
                gameStep();
                gameLoop = setTimeout(loop, speed);
            }
            loop();
        }

        async function gameOver() {
            gameRunning = false;
            clearTimeout(gameLoop);
            document.getElementById('finalScore').textContent = `Je teckel at ${score} appel${score !== 1 ? 's' : ''}!`;

            // Haal verse scores op voor check
            await getHighscores();

            if (isHighscore(score)) {
                // Nieuwe highscore! Vraag om naam
                document.getElementById('newScoreText').textContent = `Je scoorde ${score} appel${score !== 1 ? 's' : ''}!`;
                document.getElementById('playerName').value = '';
                document.getElementById('nameInput').style.display = 'block';
            } else {
                document.getElementById('gameOver').style.display = 'block';
            }
        }

        function updateScore() {
            document.getElementById('score').textContent = `Appels: ${score}`;
        }

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            switch(e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    if (direction.y !== 1) nextDirection = { x: 0, y: -1 };
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    if (direction.y !== -1) nextDirection = { x: 0, y: 1 };
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    if (direction.x !== 1) nextDirection = { x: -1, y: 0 };
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    if (direction.x !== -1) nextDirection = { x: 1, y: 0 };
                    break;
            }
        });

        // Touch/Swipe controls
        let touchStartX = 0;
        let touchStartY = 0;

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, { passive: false });

        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            const touchEndX = e.changedTouches[0].clientX;
            const touchEndY = e.changedTouches[0].clientY;

            const dx = touchEndX - touchStartX;
            const dy = touchEndY - touchStartY;

            const minSwipe = 30;

            if (Math.abs(dx) > Math.abs(dy)) {
                if (dx > minSwipe && direction.x !== -1) {
                    nextDirection = { x: 1, y: 0 };
                } else if (dx < -minSwipe && direction.x !== 1) {
                    nextDirection = { x: -1, y: 0 };
                }
            } else {
                if (dy > minSwipe && direction.y !== -1) {
                    nextDirection = { x: 0, y: 1 };
                } else if (dy < -minSwipe && direction.y !== 1) {
                    nextDirection = { x: 0, y: -1 };
                }
            }
        }, { passive: false });

        // D-pad button controls - use touchstart for iOS Safari
        function addButtonControl(btnId, dirCheck, newDir) {
            const btn = document.getElementById(btnId);
            const handler = (e) => {
                e.preventDefault();
                if (dirCheck()) {
                    nextDirection = newDir;
                }
            };
            btn.addEventListener('touchstart', handler, { passive: false });
            btn.addEventListener('click', handler);
        }

        addButtonControl('upBtn', () => direction.y !== 1, { x: 0, y: -1 });
        addButtonControl('downBtn', () => direction.y !== -1, { x: 0, y: 1 });
        addButtonControl('leftBtn', () => direction.x !== 1, { x: -1, y: 0 });
        addButtonControl('rightBtn', () => direction.x !== -1, { x: 1, y: 0 });

        // Start buttons - use touchstart for iOS Safari
        function addStartHandler(btn, handler) {
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); handler(); }, { passive: false });
            btn.addEventListener('click', handler);
        }

        addStartHandler(document.getElementById('startBtn'), startGame);
        addStartHandler(document.getElementById('restartBtn'), () => {
            document.getElementById('gameOver').style.display = 'none';
            startGame();
        });

        // Save highscore handler
        async function saveScore() {
            const name = document.getElementById('playerName').value.trim();
            await addHighscore(name, score);
            document.getElementById('nameInput').style.display = 'none';
            document.getElementById('gameOver').style.display = 'block';
        }

        addStartHandler(document.getElementById('saveScoreBtn'), saveScore);

        // Allow Enter key to save score
        document.getElementById('playerName').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                saveScore();
            }
        });

        // Share button handler
        addStartHandler(document.getElementById('shareBtn'), shareLink);

        // Initial setup
        async function init() {
            initBlobId();
            const scores = await getHighscores();
            displayHighscores(scores);
            initGame();
            draw();
        }

        init();
    </script>
</body>
</html>
