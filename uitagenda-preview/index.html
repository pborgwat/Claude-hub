<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Uit in Haarlem (preview)</title>
<meta name="robots" content="noindex">
<meta name="description" content="Vandaag, vanavond en de komende week: film en podium in Haarlem.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111118" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Uit Haarlem">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400&family=Martian+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  /* Stijl volgens DESIGN.md (SuperHi style reference). Haas Grotesk vervangen door Inter, zoals de sheet voorstelt. */
  :root {
    --iris: #2727e6;
    --ink: #111118;
    --paper: #ffffff;
    --chalk: #f0f6ff;
    --frost: #e1edff;
    --red: #ff4141;
    --yellow: #ffda00;
    --sky: #91d8ec;
    --pink: #ffbac4;
    --green: #16ab59;

    --bg: var(--chalk);
    --card: var(--paper);
    --text: var(--ink);
    --muted: rgba(17, 17, 24, .62);
    --line: var(--frost);
    --tag: var(--frost);
    --pop: var(--ink);          /* kleur van de harde offset-schaduw */
    --bar: var(--paper);
    --shape-opacity: 1;

    --font-display: 'Inter', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --font-text: 'Inter', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --font-mono: 'Martian Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  }
  /* Donkere modus staat niet in de sheet: eigen afleiding met dezelfde tokens */
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111118;
      --card: #1c1c27;
      --text: #f0f6ff;
      --muted: rgba(240, 246, 255, .62);
      --line: #2b2b3c;
      --tag: #262636;
      --pop: #000000;
      --bar: #16161f;
      --shape-opacity: .8;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 400 16px/1.4 var(--font-text);
    letter-spacing: -0.02em;
    padding-bottom: env(safe-area-inset-bottom);
  }
  button { font: inherit; letter-spacing: inherit; color: inherit; font-weight: 400; }

  /* Papierknipsel-vormen achter de inhoud */
  .shapes { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; opacity: var(--shape-opacity); }
  .shapes svg { position: absolute; }

  /* Ticker */
  .ticker {
    position: relative; z-index: 2;
    background: var(--ink); color: #fff;
    font: 400 12px/1.35 var(--font-mono); letter-spacing: -0.013em; text-transform: uppercase;
    padding: calc(env(safe-area-inset-top) + 7px) 16px 7px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .ticker span + span::before { content: "•"; margin: 0 8px; opacity: .6; }

  .top { position: relative; z-index: 1; background: var(--bar); padding: 16px 16px 4px; }
  h1 {
    margin: 0; font: 400 34px/1.05 var(--font-display); letter-spacing: -0.02em;
    display: flex; align-items: center; gap: 10px;
  }
  .mark { width: 36px; height: 36px; border-radius: 50%; background: var(--iris); display: grid; place-items: center; flex: none; }
  .mark svg { width: 18px; height: 18px; }

  .bar {
    position: sticky; top: 0; z-index: 3;
    background: var(--bar); border-bottom: 1px solid var(--line);
    padding: 10px 0 12px;
  }
  .days {
    display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x proximity; scroll-padding: 0 16px;
    padding: 2px 16px 6px; scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  .days::-webkit-scrollbar { display: none; }
  .days button {
    flex: 0 0 auto; min-width: 92px; scroll-snap-align: start;
    border: 0; border-radius: 48px; padding: 8px 16px;
    background: var(--tag); cursor: pointer; text-align: center;
    font-size: 16px; line-height: 1.1;
  }
  .days button small { display: block; font: 400 11px/1.2 var(--font-mono); letter-spacing: -0.013em; opacity: .7; margin-top: 3px; }
  .days button[aria-pressed="true"] { background: var(--iris); color: #fff; box-shadow: 0 3px 0 0 var(--pop); }

  .toggles { display: flex; gap: 8px; padding: 4px 16px 0; flex-wrap: wrap; }
  .chip {
    border: 0; border-radius: 5000px; padding: 6px 14px; background: var(--tag); cursor: pointer;
    font-size: 15px; line-height: 1.25; display: inline-flex; align-items: center; gap: 6px;
  }
  .chip::before { content: ""; width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid currentColor; opacity: .55; }
  .chip[aria-pressed="true"] { background: var(--iris); color: #fff; }
  .chip[aria-pressed="true"]::before { opacity: 1; background: #fff; border-color: #fff; box-shadow: inset 0 0 0 3px var(--iris); }
  .chip[hidden] { display: none; }

  main { position: relative; z-index: 1; max-width: 640px; margin: 0 auto; padding: 8px 16px 40px; }
  h2 {
    display: inline-block; margin: 28px 0 4px; padding: 6px 12px; border-radius: 5000px;
    background: var(--ink); color: #fff;
    font: 400 12px/1.35 var(--font-mono); letter-spacing: -0.013em; text-transform: uppercase;
  }
  @media (prefers-color-scheme: dark) { h2 { background: var(--paper); color: var(--ink); } }
  h3.slot {
    display: table; margin: 14px 0 8px; padding: 4px 12px; border-radius: 5000px;
    background: var(--card); border: 1px solid var(--line);
    font: 400 15px/1.3 var(--font-text); letter-spacing: -0.01em;
  }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 24px;
    box-shadow: 0 2px 0 0 var(--pop); overflow: hidden;
  }
  .row { display: flex; align-items: center; border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; }
  .row > a {
    flex: 1; min-width: 0; display: grid; grid-template-columns: 62px 1fr; gap: 10px;
    padding: 16px 0 16px 20px; color: inherit; text-decoration: none;
  }
  .row > a:active { background: var(--tag); }
  .row.past { opacity: .45; }
  .time { font: 400 22px/1.15 var(--font-display); letter-spacing: -0.02em; font-feature-settings: "tnum" 1; padding-top: 1px; }
  .title { font-size: 18px; line-height: 1.25; letter-spacing: -0.012em; margin-top: 6px; }
  .info { color: var(--muted); font-size: 14px; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .venue, .sold {
    display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 8px; border-radius: 5000px;
    font: 400 11px/1.35 var(--font-mono); letter-spacing: -0.013em; text-transform: uppercase;
  }
  .venue { background: var(--tag); }
  .venue svg { width: 12px; height: 12px; flex: none; }
  .sold { background: var(--ink); color: #fff; padding-left: 10px; }
  @media (prefers-color-scheme: dark) { .sold { background: var(--paper); color: var(--ink); } }
  .share {
    flex: 0 0 40px; height: 40px; margin: 0 12px 0 8px; border: 0; border-radius: 50%;
    background: var(--tag); display: grid; place-items: center; cursor: pointer; padding: 0;
  }
  .share:active { background: var(--iris); color: #fff; }
  .share svg { width: 18px; height: 18px; }

  .feature {
    display: block; margin-top: 16px; padding: 20px 24px 24px; border-radius: 24px;
    background: var(--yellow); color: var(--ink); text-decoration: none;
    box-shadow: 0 2px 0 0 var(--ink);
  }
  .feature .t { font: 400 24px/1.25 var(--font-display); letter-spacing: -0.007em; margin: 10px 0 4px; }
  .feature .m { font-size: 14px; opacity: .75; }
  .feature .venue { background: rgba(255,255,255,.6); }
  .pill {
    display: inline-block; margin-top: 16px; padding: 10px 20px; border-radius: 48px;
    background: var(--iris); color: #fff; font-size: 16px; box-shadow: 0 4px 0 0 var(--ink);
  }
  .empty { padding: 20px 24px; color: var(--muted); font-size: 15px; }

  footer {
    margin-top: 32px; padding: 20px 24px; border-radius: 24px; background: var(--tag);
    font-size: 13px; line-height: 1.6; color: var(--muted);
  }
  footer .meta { font: 400 12px/1.35 var(--font-mono); letter-spacing: -0.013em; text-transform: uppercase; color: var(--text); margin-bottom: 8px; }
  footer a { color: var(--text); }
  footer .warn { color: var(--text); background: var(--card); border-radius: 16px; padding: 8px 12px; margin: 8px 0; }
  footer .links { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 4px 12px; }
  .loading { margin-top: 24px; }
  .toast {
    position: fixed; z-index: 10; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 24px); transform: translateX(-50%);
    background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 48px; font-size: 15px;
    box-shadow: 0 3px 0 0 var(--iris); opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="shapes" aria-hidden="true">
  <svg style="right:-90px; top:190px; width:230px; transform:rotate(12deg)" viewBox="0 0 100 95"><polygon points="50,0 100,36 81,95 19,95 0,36" fill="var(--yellow)"/></svg>
  <svg style="left:-120px; top:48%; width:260px; transform:rotate(-10deg)" viewBox="0 0 100 50"><path d="M0 50 A50 50 0 0 1 100 50 Z" fill="var(--red)"/></svg>
  <svg style="right:-70px; bottom:6%; width:220px; transform:rotate(-14deg)" viewBox="0 0 100 87"><polygon points="50,0 100,87 0,87" fill="var(--green)"/></svg>
  <svg style="left:-80px; bottom:-60px; width:200px" viewBox="0 0 100 100"><circle cx="50" cy="50" r="50" fill="var(--sky)"/></svg>
  <svg style="right:-60px; top:58%; width:170px; transform:rotate(8deg)" viewBox="0 0 100 95"><polygon points="50,0 61,35 98,35 68,57 79,92 50,70 21,92 32,57 2,35 39,35" fill="var(--pink)"/></svg>
</div>

<div class="ticker" id="ticker"><span>Uit in Haarlem</span><span>Film en podium</span></div>
<div class="top">
  <h1><span class="mark" aria-hidden="true"><svg viewBox="0 0 100 95"><polygon points="50,0 61,35 98,35 68,57 79,92 50,70 21,92 32,57 2,35 39,35" fill="#fff"/></svg></span>Uit in Haarlem</h1>
</div>
<nav class="bar">
  <div class="days" id="days"></div>
  <div class="toggles">
    <button class="chip" id="fromNow" aria-pressed="true">Alleen wat nog komt</button>
    <button class="chip" id="showPathe" aria-pressed="false">Pathé tonen</button>
  </div>
</nav>
<main id="app"><div class="card loading"><div class="empty">Agenda laden...</div></div></main>
<div class="toast" id="toast"></div>

<script>
const VENUE_SITES = {
  Filmkoepel: 'https://filmkoepel.nl/agenda/',
  Schuur: 'https://www.schuur.nl/agenda',
  'Pathé': 'https://www.pathe.nl/nl/bioscopen/pathe-haarlem',
  Phil: 'https://philhaarlem.nl/agenda',
  Patronaat: 'https://patronaat.nl/programma/',
  'De Liefde': 'https://theaterdeliefde.nl/agenda/',
  Stadsschouwburg: 'https://stadsschouwburghaarlem.nl/agenda',
};
// Elke zaal een eigen papierknipsel-vorm; accentkleuren alleen als vulling, nooit op tekst
const SHAPES = {
  circle: '<svg viewBox="0 0 12 12"><circle cx="6" cy="6" r="6" fill="COL"/></svg>',
  triangle: '<svg viewBox="0 0 12 12"><polygon points="6,0.5 12,11.5 0,11.5" fill="COL"/></svg>',
  semi: '<svg viewBox="0 0 12 12"><path d="M0 9 A6 6 0 0 1 12 9 Z" fill="COL"/></svg>',
  star: '<svg viewBox="0 0 100 95"><polygon points="50,0 61,35 98,35 68,57 79,92 50,70 21,92 32,57 2,35 39,35" fill="COL"/></svg>',
  pentagon: '<svg viewBox="0 0 100 95"><polygon points="50,0 100,36 81,95 19,95 0,36" fill="COL"/></svg>',
};
const VENUE_SHAPES = {
  Filmkoepel: ['triangle', 'var(--green)'],
  Schuur: ['semi', 'var(--red)'],
  'Pathé': ['circle', 'var(--sky)'],
  Phil: ['star', 'var(--pink)'],
  Patronaat: ['pentagon', 'var(--yellow)'],
  'De Liefde': ['star', 'var(--red)'],
  Stadsschouwburg: ['pentagon', 'var(--sky)'],
};
const NUM_DAYS = 7;
const DAYNAMES = ['zo', 'ma', 'di', 'wo', 'do', 'vr', 'za'];
const DAYFULL = ['Zondag', 'Maandag', 'Dinsdag', 'Woensdag', 'Donderdag', 'Vrijdag', 'Zaterdag'];
const MONTHNAMES = ['jan', 'feb', 'mrt', 'apr', 'mei', 'jun', 'jul', 'aug', 'sep', 'okt', 'nov', 'dec'];
const SHARE_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M8 7l4-4 4 4"/><path d="M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></svg>';

const pad = (n) => String(n).padStart(2, '0');
const isoDate = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const esc = (s = '') => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function venueTag(v) {
  const [shape, col] = VENUE_SHAPES[v] || ['circle', 'var(--sky)'];
  return `<span class="venue">${SHAPES[shape].replace('COL', col)}${esc(v)}</span>`;
}

const store = {
  get(k, def) { try { const v = localStorage.getItem(k); return v === null ? def : JSON.parse(v); } catch { return def; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

let data = null;
let dayIndex = 0;
let fromNow = true;
let showPathe = store.get('uitagenda.pathe', false);
let rendered = []; // events op het scherm, voor de deelknoppen

function days() {
  const base = new Date();
  return Array.from({ length: NUM_DAYS }, (_, i) => {
    const d = new Date(base.getFullYear(), base.getMonth(), base.getDate() + i);
    const label = i === 0 ? 'Vandaag' : i === 1 ? 'Morgen' : DAYFULL[d.getDay()];
    return { iso: isoDate(d), label, sub: `${DAYNAMES[d.getDay()]} ${d.getDate()} ${MONTHNAMES[d.getMonth()]}` };
  });
}

// Is een voorstelling al (ruim) begonnen? Films 10 min speling, podium 30 min.
function isPast(ev) {
  if (!ev.time || ev.date !== isoDate(new Date())) return false;
  const [h, m] = ev.time.split(':').map(Number);
  const start = new Date(); start.setHours(h, m, 0, 0);
  // Tijden na middernacht (bijv. clubnacht 00:30) horen bij de avond ervoor
  if (h < 5) start.setDate(start.getDate() + 1);
  const grace = (ev.kind === 'film' ? 10 : 30) * 60000;
  return Date.now() > start.getTime() + grace;
}

function slotOf(time) {
  if (!time) return 'Hele dag';
  const h = Number(time.slice(0, 2));
  if (h < 5) return 'Nacht';
  if (h < 12) return 'Ochtend';
  if (h < 18) return 'Middag';
  return 'Vanavond';
}

function renderDays() {
  const el = document.getElementById('days');
  el.innerHTML = days().map((d, i) =>
    `<button aria-pressed="${i === dayIndex}" data-i="${i}">${d.label}<small>${d.sub}</small></button>`).join('');
  el.querySelectorAll('button').forEach((b) => b.onclick = () => { dayIndex = Number(b.dataset.i); render(); window.scrollTo(0, 0); });
  document.getElementById('fromNow').hidden = dayIndex !== 0;
  document.getElementById('fromNow').setAttribute('aria-pressed', fromNow);
  document.getElementById('showPathe').setAttribute('aria-pressed', showPathe);
}

function row(ev, past) {
  const i = rendered.push(ev) - 1;
  return `<div class="row${past ? ' past' : ''}">
    <a href="${esc(ev.url)}" target="_blank" rel="noopener">
      <div class="time">${ev.time || '—'}</div>
      <div>
        <div class="tags">${venueTag(ev.venue)}${ev.soldOut ? '<span class="sold">Uitverkocht</span>' : ''}</div>
        <div class="title">${esc(ev.title)}</div>
        ${ev.info ? `<div class="info">${esc(ev.info)}</div>` : ''}
      </div>
    </a>
    <button class="share" data-share="${i}" aria-label="Deel ${esc(ev.title)}">${SHARE_ICON}</button>
  </div>`;
}

function section(title, list, emptyText, pastFn = () => false) {
  let html = `<h2>${title}</h2>`;
  if (!list.length) return html + `<div class="card" style="margin-top:12px"><div class="empty">${emptyText}</div></div>`;
  let last = '';
  for (const ev of list) {
    const slot = slotOf(ev.time);
    if (slot !== last) {
      if (last) html += '</div>';
      html += `<h3 class="slot">${slot}</h3><div class="card">`;
      last = slot;
    }
    html += row(ev, pastFn(ev));
  }
  return html + '</div>';
}

function render() {
  renderDays();
  if (!data) return;
  rendered = [];
  const day = days()[dayIndex];
  const onlyUpcoming = dayIndex === 0 && fromNow;
  const events = data.events.filter((e) => e.date === day.iso && !(onlyUpcoming && isPast(e)));
  const podium = events.filter((e) => e.kind !== 'film');
  const films = events.filter((e) => e.kind === 'film' && (showPathe || e.venue !== 'Pathé'));
  const updated = new Date(data.generated);
  const updatedTxt = updated.toLocaleString('nl-NL', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  const updatedShort = isoDate(updated) === isoDate(new Date())
    ? updated.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' }) : updatedTxt;
  document.getElementById('ticker').innerHTML =
    `<span>Preview</span><span>${esc(day.sub)}</span><span>${podium.length} podium</span><span>${films.length} film</span><span>update ${esc(updatedShort)}</span>`;

  const cinemas = showPathe ? 'Filmkoepel, Schuur of Pathé' : 'Filmkoepel of Schuur';
  let html = section('Podium · theater, concerten, clubs', podium, 'Niets gevonden bij Phil, Patronaat, De Liefde of Schuur.', isPast);
  html += `<a class="feature" href="${VENUE_SITES.Stadsschouwburg}" target="_blank" rel="noopener">
    ${venueTag('Stadsschouwburg')}
    <div class="t">Wat speelt er in de Stadsschouwburg?</div>
    <div class="m">Hun site laat geen automatisch ophalen toe, daarom een directe link.</div>
    <span class="pill">Bekijk de agenda →</span>
  </a>`;
  html += section('Film', films, `Geen voorstellingen gevonden bij ${cinemas}. Het nieuwe filmprogramma verschijnt meestal pas op maandag of dinsdag.`, isPast);

  const failed = Object.entries(data.status || {}).filter(([, s]) => !s.ok).map(([n]) => n);
  const covered = (data.days || []).includes(day.iso);
  html += `<footer>
    <div class="meta">Bijgewerkt ${esc(updatedTxt)}</div>
    ${failed.length ? `<div class="warn">Laatste update mislukt voor: ${failed.join(', ')} (oude gegevens getoond)</div>` : ''}
    ${!covered ? `<div class="warn">Voor deze dag zijn nog geen gegevens opgehaald.</div>` : ''}
    Tijden onder voorbehoud, check altijd de site van de zaal. De Liefde via Podiuminfo, Pathé via Filmladder.
    <div class="links">${Object.entries(VENUE_SITES).map(([n, u]) => `<a href="${u}" target="_blank" rel="noopener">${n}</a>`).join('')}</div>
  </footer>`;
  document.getElementById('app').innerHTML = html;
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

async function share(ev) {
  const [y, m, d] = ev.date.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  const when = `${DAYNAMES[dt.getDay()]} ${d} ${MONTHNAMES[m - 1]}${ev.time ? ' ' + ev.time : ''}`;
  const text = `${ev.title} - ${ev.venue}, ${when}`;
  if (navigator.share) {
    try { await navigator.share({ title: ev.title, text, url: ev.url }); } catch {}
    return;
  }
  try { await navigator.clipboard.writeText(`${text}\n${ev.url}`); toast('Link gekopieerd'); }
  catch { prompt('Kopieer de link:', ev.url); }
}

document.getElementById('app').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-share]');
  if (btn) share(rendered[Number(btn.dataset.share)]);
});
document.getElementById('fromNow').onclick = () => { fromNow = !fromNow; render(); };
document.getElementById('showPathe').onclick = () => { showPathe = !showPathe; store.set('uitagenda.pathe', showPathe); render(); };

async function load() {
  try {
    const res = await fetch('../uitagenda/events.json?t=' + Date.now(), { cache: 'no-store' });
    data = await res.json();
  } catch (e) {
    if (!data) document.getElementById('app').innerHTML = '<div class="card loading"><div class="empty">Kon de agenda niet laden. Heb je internet?</div></div>';
    return;
  }
  render();
}

renderDays();
load();
// Bij terugkeren naar de app: opnieuw laden en "wat nog komt" bijwerken
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
setInterval(render, 5 * 60000);
// Preview: geen service worker, zodat de live app er geen last van heeft
</script>
</body>
</html>
