<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>The Office US - Expert Quiz</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a2e;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #e0e0e0;
        }

        .start-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }

        .start-screen h1 {
            font-size: clamp(2rem, 6vw, 3.5rem);
            color: #fff;
            margin-bottom: 10px;
        }

        .start-screen .subtitle {
            font-size: clamp(1rem, 3vw, 1.4rem);
            color: #aaa;
            margin-bottom: 30px;
        }

        .logo {
            font-size: clamp(4rem, 12vw, 8rem);
            margin-bottom: 20px;
        }

        .start-btn {
            padding: 18px 50px;
            font-size: clamp(1.1rem, 3vw, 1.4rem);
            background: linear-gradient(145deg, #4a90d9, #357abd);
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(74, 144, 217, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: 600;
        }

        .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(74, 144, 217, 0.5);
        }

        .start-btn:active {
            transform: scale(0.97);
        }

        .difficulty-info {
            margin-top: 25px;
            padding: 15px 25px;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            font-size: 0.95rem;
            color: #999;
            max-width: 400px;
        }

        .quiz-container {
            display: none;
            max-width: 700px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .header .question-count {
            font-size: 1rem;
            color: #aaa;
        }

        .header .score-display {
            font-size: 1rem;
            color: #4a90d9;
            font-weight: 600;
        }

        .progress-bar-container {
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #4a90d9, #63b3ed);
            border-radius: 4px;
            transition: width 0.4s ease;
            width: 0%;
        }

        .question-card {
            background: rgba(255,255,255,0.06);
            border-radius: 16px;
            padding: clamp(20px, 4vw, 35px);
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .category-tag {
            display: inline-block;
            padding: 4px 12px;
            background: rgba(74, 144, 217, 0.2);
            color: #63b3ed;
            border-radius: 20px;
            font-size: 0.8rem;
            margin-bottom: 15px;
            font-weight: 500;
        }

        .question-text {
            font-size: clamp(1.1rem, 3vw, 1.35rem);
            line-height: 1.5;
            color: #fff;
            margin-bottom: 25px;
            font-weight: 500;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            width: 100%;
            padding: 16px 20px;
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: #e0e0e0;
            font-size: clamp(0.95rem, 2.5vw, 1.05rem);
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
            line-height: 1.4;
        }

        .option-btn:hover:not(.disabled) {
            background: rgba(74, 144, 217, 0.15);
            border-color: rgba(74, 144, 217, 0.4);
        }

        .option-btn.correct {
            background: rgba(72, 187, 120, 0.2);
            border-color: #48bb78;
            color: #48bb78;
        }

        .option-btn.wrong {
            background: rgba(245, 101, 101, 0.2);
            border-color: #f56565;
            color: #f56565;
        }

        .option-btn.disabled {
            cursor: default;
            opacity: 0.6;
        }

        .option-btn.disabled.correct {
            opacity: 1;
        }

        .explanation {
            display: none;
            margin-top: 20px;
            padding: 15px 20px;
            background: rgba(255,255,255,0.04);
            border-radius: 10px;
            border-left: 3px solid #4a90d9;
            font-size: 0.95rem;
            line-height: 1.5;
            color: #bbb;
        }

        .next-btn {
            display: none;
            margin: 25px auto 0;
            padding: 14px 40px;
            background: linear-gradient(145deg, #4a90d9, #357abd);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 1.05rem;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s;
        }

        .next-btn:hover {
            transform: translateY(-1px);
        }

        .next-btn:active {
            transform: scale(0.97);
        }

        .result-screen {
            display: none;
            text-align: center;
            padding: 40px 20px;
            min-height: 100vh;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .result-screen h2 {
            font-size: clamp(2rem, 6vw, 3rem);
            margin-bottom: 15px;
        }

        .result-score {
            font-size: clamp(3rem, 10vw, 5rem);
            font-weight: 800;
            margin: 20px 0;
        }

        .result-label {
            font-size: clamp(1rem, 3vw, 1.3rem);
            color: #aaa;
            margin-bottom: 10px;
        }

        .result-message {
            font-size: clamp(1.1rem, 3vw, 1.4rem);
            color: #ccc;
            margin: 20px 0 30px;
            max-width: 500px;
            line-height: 1.5;
        }

        .result-stats {
            display: flex;
            gap: 30px;
            justify-content: center;
            margin: 20px 0 30px;
            flex-wrap: wrap;
        }

        .stat-box {
            background: rgba(255,255,255,0.06);
            padding: 15px 25px;
            border-radius: 12px;
            min-width: 120px;
        }

        .stat-box .stat-num {
            font-size: 1.8rem;
            font-weight: 700;
        }

        .stat-box .stat-label {
            font-size: 0.85rem;
            color: #999;
            margin-top: 4px;
        }

        .stat-correct .stat-num { color: #48bb78; }
        .stat-wrong .stat-num { color: #f56565; }
        .stat-pct .stat-num { color: #4a90d9; }

        .restart-btn {
            padding: 16px 45px;
            font-size: 1.1rem;
            background: linear-gradient(145deg, #4a90d9, #357abd);
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s;
        }

        .restart-btn:hover {
            transform: translateY(-2px);
        }

        @media (max-width: 480px) {
            .quiz-container { padding: 15px; }
            .question-card { padding: 18px; }
            .option-btn { padding: 14px 16px; }
        }
    </style>
</head>
<body>

<div class="start-screen" id="startScreen">
    <div class="logo">🏢</div>
    <h1>The Office US</h1>
    <p class="subtitle">Expert Kennisquiz - 100 Vragen</p>
    <button class="start-btn" id="startBtn">Start de Quiz</button>

        100 expert-level vragen over alle 9 seizoenen van The Office. Alleen echte Dunder Mifflin kenners halen een hoge score!

</div>

<div class="quiz-container" id="quizContainer">

    </div>

        <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="question-card">
        <div class="category-tag" id="categoryTag">Categorie</div>

        <div class="options" id="optionsContainer"></div>
        <div class="explanation" id="explanation"></div>
    </div>
    <button class="next-btn" id="nextBtn">Volgende vraag</button>
</div>

<div class="result-screen" id="resultScreen">
    <h2>Quiz Voltooid!</h2>
    <div class="result-label">Je score</div>
    <div class="result-score" id="resultScore">0/100</div>
    <div class="result-stats">
        <div class="stat-box stat-correct">
            <div class="stat-num" id="statCorrect">0</div>
            <div class="stat-label">Goed</div>
        </div>
        <div class="stat-box stat-wrong">
            <div class="stat-num" id="statWrong">0</div>
            <div class="stat-label">Fout</div>
        </div>
        <div class="stat-box stat-pct">
            <div class="stat-num" id="statPct">0%</div>
            <div class="stat-label">Percentage</div>
        </div>
    </div>
    <div class="result-message" id="resultMessage"></div>
    <button class="restart-btn" id="restartBtn">Opnieuw Spelen</button>
</div>

let currentQuestion = 0;
let score = 0;
let answered = false;
let shuffledQuestions = [];

function shuffleArray(array) {
    const shuffled = [...array];
    for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    return shuffled;
}

function startQuiz() {
    document.getElementById('startScreen').style.display = 'none';
    document.getElementById('quizContainer').style.display = 'block';
    document.getElementById('resultScreen').style.display = 'none';
    shuffledQuestions = shuffleArray(questions);
    currentQuestion = 0;
    score = 0;
    showQuestion();
}

function showQuestion() {
    answered = false;
    const q = shuffledQuestions[currentQuestion];

    document.getElementById('questionCount').textContent = `Vraag ${currentQuestion + 1} / ${shuffledQuestions.length}`;
    document.getElementById('scoreDisplay').textContent = `Score: ${score}`;
    document.getElementById('progressBar').style.width = `${((currentQuestion) / shuffledQuestions.length) * 100}%`;
    document.getElementById('categoryTag').textContent = q.category;
    document.getElementById('questionText').textContent = q.question;
    document.getElementById('explanation').style.display = 'none';
    document.getElementById('nextBtn').style.display = 'none';

    const container = document.getElementById('optionsContainer');
    container.innerHTML = '';

    const labels = ['A', 'B', 'C', 'D'];
    q.options.forEach((option, index) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = `${labels[index]}. ${option}`;
        btn.addEventListener('click', () => selectAnswer(index, btn));
        container.appendChild(btn);
    });
}

function selectAnswer(index, btn) {
    if (answered) return;
    answered = true;

    const q = shuffledQuestions[currentQuestion];
    const buttons = document.querySelectorAll('.option-btn');

    buttons.forEach((b, i) => {
        b.classList.add('disabled');
        if (i === q.correct) {
            b.classList.add('correct');
        }
    });

    if (index === q.correct) {
        score++;
        btn.classList.add('correct');
    } else {
        btn.classList.add('wrong');
    }

    document.getElementById('scoreDisplay').textContent = `Score: ${score}`;

    const explanation = document.getElementById('explanation');
    explanation.textContent = q.explanation;
    explanation.style.display = 'block';

    const nextBtn = document.getElementById('nextBtn');
    nextBtn.style.display = 'block';
    nextBtn.textContent = currentQuestion < shuffledQuestions.length - 1 ? 'Volgende vraag' : 'Bekijk resultaat';
}

function nextQuestion() {
    currentQuestion++;
    if (currentQuestion < shuffledQuestions.length) {
        showQuestion();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    } else {
        showResults();
    }
}

function showResults() {
    document.getElementById('quizContainer').style.display = 'none';
    const resultScreen = document.getElementById('resultScreen');
    resultScreen.style.display = 'flex';

    const total = shuffledQuestions.length;
    const pct = Math.round((score / total) * 100);
    const wrong = total - score;

    document.getElementById('resultScore').textContent = `${score} / ${total}`;
    document.getElementById('statCorrect').textContent = score;
    document.getElementById('statWrong').textContent = wrong;
    document.getElementById('statPct').textContent = `${pct}%`;

    let message = '';
    if (pct >= 95) {
        message = 'Ongelooflijk! Je bent een absolute Office-expert! Michael Scott zou trots op je zijn!';
    } else if (pct >= 80) {
        message = 'Uitstekend! Je kent The Office als je broekzak. Dwight zou je accepteren als Assistant to the Assistant Regional Manager!';
    } else if (pct >= 65) {
        message = 'Goed gedaan! Je bent duidelijk een fan, maar er zijn nog wat details die je kunt leren. Tijd voor een rewatch!';
    } else if (pct >= 50) {
        message = 'Niet slecht! Je kent de basis, maar een echte Dunder Mifflin-kenner heeft meer parate kennis nodig.';
    } else if (pct >= 30) {
        message = 'Je hebt The Office gekeken, maar misschien niet alle seizoenen? Tijd voor een marathon!';
    } else {
        message = 'Hmm, heb je The Office wel gezien? Geen zorgen - nu heb je een excuus om alle 9 seizoenen te bingen!';
    }
    document.getElementById('resultMessage').textContent = message;

    document.getElementById('resultScore').style.color =
        pct >= 80 ? '#48bb78' : pct >= 50 ? '#4a90d9' : '#f56565';
}

document.getElementById('startBtn').addEventListener('click', startQuiz);
document.getElementById('nextBtn').addEventListener('click', nextQuestion);
document.getElementById('restartBtn').addEventListener('click', startQuiz);
</script>
