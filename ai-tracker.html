<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AI Tracker">
  <title>AI Conversation Tracker</title>
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #13131a;
      --card: #1c1c26;
      --border: #2a2a3a;
      --accent: #6c63ff;
      --accent2: #ff6584;
      --green: #43e97b;
      --text: #f0f0f5;
      --muted: #7070a0;
      --radius: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      min-height: -webkit-fill-available;
      overflow-x: hidden;
    }

    /* NAV */
    nav {
      display: flex;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: env(safe-area-inset-top, 0) 0 0;
    }
    nav button {
      flex: 1;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      padding: 12px 8px 14px;
      cursor: pointer;
      letter-spacing: .5px;
      text-transform: uppercase;
      transition: color .2s;
      position: relative;
    }
    nav button.active { color: var(--accent); }
    nav button.active::after {
      content: '';
      position: absolute;
      bottom: 0; left: 15%; right: 15%;
      height: 2px;
      background: var(--accent);
      border-radius: 2px 2px 0 0;
    }

    /* PAGES */
    .page { display: none; padding: 24px 16px; padding-bottom: calc(24px + env(safe-area-inset-bottom, 0)); }
    .page.active { display: block; }

    /* STOPWATCH */
    .watch-display {
      text-align: center;
      margin: 24px 0 32px;
    }
    .timer-big {
      font-size: 72px;
      font-weight: 100;
      letter-spacing: -2px;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      color: var(--text);
    }
    .timer-big.running { color: var(--green); }
    .timer-sub {
      font-size: 14px;
      color: var(--muted);
      margin-top: 6px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: var(--radius);
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      transition: transform .1s, opacity .2s;
      letter-spacing: .3px;
    }
    .btn:active { transform: scale(.97); }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-danger  { background: var(--accent2); color: #fff; }
    .btn-neutral { background: var(--card); color: var(--text); border: 1px solid var(--border); }
    .btn:disabled { opacity: .35; pointer-events: none; }

    .ai-hit-btn {
      height: 140px;
      font-size: 22px;
      background: linear-gradient(135deg, #6c63ff, #ff6584);
      color: #fff;
      border: none;
      border-radius: 24px;
      box-shadow: 0 8px 32px rgba(108,99,255,.35);
      margin: 8px 0;
    }
    .ai-hit-btn:disabled { opacity: .25; box-shadow: none; }

    .btn-row { display: flex; gap: 10px; }
    .btn-row .btn { flex: 1; }

    /* MODAL / SHEET */
    .sheet-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.6);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: flex; align-items: flex-end;
      opacity: 0; pointer-events: none;
      transition: opacity .25s;
    }
    .sheet-overlay.open { opacity: 1; pointer-events: all; }
    .sheet {
      background: var(--surface);
      border-radius: 24px 24px 0 0;
      padding: 24px 20px calc(24px + env(safe-area-inset-bottom, 0));
      width: 100%;
      transform: translateY(100%);
      transition: transform .3s cubic-bezier(.32,1,.23,1);
    }
    .sheet-overlay.open .sheet { transform: translateY(0); }
    .sheet-handle {
      width: 40px; height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin: 0 auto 20px;
    }
    .sheet h2 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .hit-time-display {
      font-size: 48px;
      font-weight: 200;
      font-variant-numeric: tabular-nums;
      color: var(--green);
      text-align: center;
      margin: 16px 0 24px;
    }
    .hit-time-label {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      margin-top: -20px;
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .8px;
      color: var(--muted);
      margin-bottom: 8px;
    }
    input[type="text"] {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 16px;
      padding: 14px 16px;
      margin-bottom: 16px;
      outline: none;
      -webkit-appearance: none;
      transition: border-color .2s;
    }
    input[type="text"]:focus { border-color: var(--accent); }
    input[type="text"]::placeholder { color: var(--muted); }

    /* SCOREBOARD */
    .score-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .score-header h1 { font-size: 24px; font-weight: 700; }
    .clear-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      font-size: 12px;
      padding: 6px 12px;
      cursor: pointer;
    }

    .stat-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 12px;
      text-align: center;
    }
    .stat-card .num { font-size: 28px; font-weight: 700; color: var(--accent); }
    .stat-card .lbl { font-size: 11px; color: var(--muted); margin-top: 2px; }

    .entry-list { display: flex; flex-direction: column; gap: 10px; }
    .entry {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 4px 12px;
      align-items: start;
    }
    .entry-name { font-weight: 600; font-size: 15px; }
    .entry-time-val {
      font-size: 22px;
      font-weight: 700;
      color: var(--green);
      font-variant-numeric: tabular-nums;
      text-align: right;
      grid-row: 1 / 3;
      align-self: center;
    }
    .entry-meta { font-size: 12px; color: var(--muted); }
    .entry-trigger {
      display: inline-block;
      background: rgba(108,99,255,.18);
      color: var(--accent);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 600;
      margin-top: 6px;
    }
    .entry-loc { font-size: 11px; color: var(--muted); margin-top: 3px; }
    .empty {
      text-align: center;
      color: var(--muted);
      padding: 60px 20px;
      font-size: 15px;
    }
    .empty span { font-size: 48px; display: block; margin-bottom: 12px; }

    .section-title {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .8px;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .pulse {
      animation: pulse 1s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .6; }
    }

    .location-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: var(--muted);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 4px 10px;
      margin-bottom: 20px;
    }
    .location-badge.got { color: var(--green); border-color: rgba(67,233,123,.3); }
  </style>
</head>
<body>

<nav>
  <button class="active" onclick="showPage('tracker')">Tracker</button>
  <button onclick="showPage('score')">Scoreboard</button>
</nav>

<!-- TRACKER PAGE -->
<div id="page-tracker" class="page active">
  <div class="watch-display">
    <div class="timer-big" id="timerDisplay">00:00</div>
    <div class="timer-sub" id="timerSub">Gesprek nog niet gestart</div>
  </div>

  <div id="locationBadge" class="location-badge">
    📍 Locatie ophalen…
  </div>

  <button class="ai-hit-btn btn" id="hitBtn" disabled onclick="onAiHit()">
    🤖 AI ter sprake!
  </button>

  <div style="height:14px"></div>

  <div class="btn-row">
    <button class="btn btn-primary" id="startBtn" onclick="startConversation()">▶ Start gesprek</button>
    <button class="btn btn-neutral" id="resetBtn" onclick="resetTracker()" disabled>Reset</button>
  </div>
</div>

<!-- SCOREBOARD PAGE -->
<div id="page-score" class="page">
  <div class="score-header">
    <h1>Scoreboard</h1>
    <button class="clear-btn" onclick="clearAll()">Wis alles</button>
  </div>

  <div class="stat-row">
    <div class="stat-card">
      <div class="num" id="statTotal">0</div>
      <div class="lbl">Gesprekken</div>
    </div>
    <div class="stat-card">
      <div class="num" id="statAvg">–</div>
      <div class="lbl">Gem. tijd</div>
    </div>
    <div class="stat-card">
      <div class="num" id="statFastest">–</div>
      <div class="lbl">Snelste</div>
    </div>
  </div>

  <div class="section-title">Recente gesprekken</div>
  <div class="entry-list" id="entryList"></div>
</div>

<!-- SHEET: log entry -->
<div class="sheet-overlay" id="sheetOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h2>AI ter sprake! 🎉</h2>

    <div class="hit-time-display" id="sheetTime">00:00</div>
    <div class="hit-time-label">seconden tot eerste AI-mention</div>

    <label for="partnerInput">Gesprekspartner</label>
    <input type="text" id="partnerInput" placeholder="Naam of omschrijving…" autocomplete="off">

    <label for="triggerInput">Trigger woord</label>
    <input type="text" id="triggerInput" placeholder="AI, Claude, ChatGPT…" autocomplete="off">

    <button class="btn btn-primary" onclick="saveEntry()">Opslaan in scoreboard</button>
    <div style="height:10px"></div>
    <button class="btn btn-neutral" onclick="closeSheet()">Annuleren</button>
  </div>
</div>

<script>
  // ─── State ───────────────────────────────────────────────────────
  let startTime = null;
  let hitTime   = null;
  let timerInterval = null;
  let currentLocation = null;
  let pendingElapsed = 0;

  // ─── Location ────────────────────────────────────────────────────
  function getLocation() {
    if (!navigator.geolocation) {
      setBadge(false, 'Locatie niet beschikbaar');
      return;
    }
    navigator.geolocation.getCurrentPosition(
      pos => {
        currentLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude, acc: Math.round(pos.coords.accuracy) };
        reverseGeocode(currentLocation);
      },
      () => setBadge(false, 'Locatie geweigerd'),
      { timeout: 8000, enableHighAccuracy: false }
    );
  }

  async function reverseGeocode(loc) {
    try {
      const url = `https://nominatim.openstreetmap.org/reverse?lat=${loc.lat}&lon=${loc.lng}&format=json`;
      const r = await fetch(url, { headers: { 'Accept-Language': 'nl' } });
      const d = await r.json();
      const addr = d.address || {};
      const parts = [addr.road, addr.city || addr.town || addr.village].filter(Boolean);
      const label = parts.length ? parts.join(', ') : `${loc.lat.toFixed(3)}, ${loc.lng.toFixed(3)}`;
      currentLocation.label = label;
      setBadge(true, label);
    } catch {
      setBadge(true, `${loc.lat.toFixed(3)}, ${loc.lng.toFixed(3)}`);
    }
  }

  function setBadge(success, text) {
    const b = document.getElementById('locationBadge');
    b.textContent = (success ? '📍 ' : '📍 ') + text;
    b.className = 'location-badge' + (success ? ' got' : '');
  }

  // ─── Timer ───────────────────────────────────────────────────────
  function formatTime(ms) {
    const s = Math.floor(ms / 1000);
    const m = Math.floor(s / 60);
    const ss = s % 60;
    return `${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;
  }

  function formatSec(ms) {
    const s = (ms / 1000).toFixed(1);
    return s + 's';
  }

  function startConversation() {
    startTime = Date.now();
    hitTime   = null;
    getLocation();

    timerInterval = setInterval(() => {
      const el = document.getElementById('timerDisplay');
      el.textContent = formatTime(Date.now() - startTime);
      el.className = 'timer-big running pulse';
    }, 100);

    document.getElementById('timerSub').textContent = 'Gesprek loopt…';
    document.getElementById('startBtn').disabled = true;
    document.getElementById('hitBtn').disabled = false;
    document.getElementById('resetBtn').disabled = false;
  }

  function onAiHit() {
    if (!startTime || hitTime) return;
    hitTime = Date.now();
    pendingElapsed = hitTime - startTime;

    clearInterval(timerInterval);
    timerInterval = null;

    const el = document.getElementById('timerDisplay');
    el.className = 'timer-big';
    el.textContent = formatTime(pendingElapsed);
    document.getElementById('timerSub').textContent = 'AI ter sprake na ' + formatSec(pendingElapsed);
    document.getElementById('hitBtn').disabled = true;

    openSheet();
  }

  function resetTracker() {
    clearInterval(timerInterval);
    timerInterval = null;
    startTime = null;
    hitTime   = null;
    pendingElapsed = 0;

    const el = document.getElementById('timerDisplay');
    el.textContent = '00:00';
    el.className = 'timer-big';
    document.getElementById('timerSub').textContent = 'Gesprek nog niet gestart';
    document.getElementById('startBtn').disabled = false;
    document.getElementById('hitBtn').disabled = true;
    document.getElementById('resetBtn').disabled = true;
    closeSheet();
  }

  // ─── Sheet ───────────────────────────────────────────────────────
  function openSheet() {
    document.getElementById('sheetTime').textContent = formatTime(pendingElapsed);
    document.getElementById('partnerInput').value = '';
    document.getElementById('triggerInput').value = '';
    document.getElementById('sheetOverlay').classList.add('open');
    setTimeout(() => document.getElementById('partnerInput').focus(), 400);
  }

  function closeSheet() {
    document.getElementById('sheetOverlay').classList.remove('open');
  }

  // close on backdrop tap
  document.getElementById('sheetOverlay').addEventListener('click', e => {
    if (e.target === document.getElementById('sheetOverlay')) closeSheet();
  });

  // ─── Save ────────────────────────────────────────────────────────
  function saveEntry() {
    const partner = document.getElementById('partnerInput').value.trim() || 'Onbekend';
    const trigger = document.getElementById('triggerInput').value.trim() || 'AI';

    const entry = {
      id: Date.now(),
      partner,
      trigger,
      elapsedMs: pendingElapsed,
      datetime: new Date(hitTime).toISOString(),
      location: currentLocation ? (currentLocation.label || `${currentLocation.lat.toFixed(4)}, ${currentLocation.lng.toFixed(4)}`) : null
    };

    const entries = loadEntries();
    entries.unshift(entry);
    localStorage.setItem('ai_tracker_entries', JSON.stringify(entries));

    closeSheet();
    resetTracker();
    renderScore();
    showPage('score');
  }

  // ─── Storage ─────────────────────────────────────────────────────
  function loadEntries() {
    try { return JSON.parse(localStorage.getItem('ai_tracker_entries') || '[]'); }
    catch { return []; }
  }

  function clearAll() {
    if (!confirm('Weet je zeker dat je alle data wilt wissen?')) return;
    localStorage.removeItem('ai_tracker_entries');
    renderScore();
  }

  // ─── Render score ────────────────────────────────────────────────
  function renderScore() {
    const entries = loadEntries();
    document.getElementById('statTotal').textContent = entries.length;

    if (entries.length === 0) {
      document.getElementById('statAvg').textContent = '–';
      document.getElementById('statFastest').textContent = '–';
      document.getElementById('entryList').innerHTML = `<div class="empty"><span>🤖</span>Nog geen gesprekken gelogd.<br>Start een gesprek en druk op de grote knop!</div>`;
      return;
    }

    const times = entries.map(e => e.elapsedMs);
    const avg = times.reduce((a,b) => a+b, 0) / times.length;
    const min = Math.min(...times);
    document.getElementById('statAvg').textContent = formatTime(avg);
    document.getElementById('statFastest').textContent = formatTime(min);

    document.getElementById('entryList').innerHTML = entries.map(e => {
      const d = new Date(e.datetime);
      const dateStr = d.toLocaleDateString('nl-NL', { day: 'numeric', month: 'short' });
      const timeStr = d.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });
      const loc = e.location ? `<div class="entry-loc">📍 ${e.location}</div>` : '';
      return `
        <div class="entry">
          <div class="entry-name">${escHtml(e.partner)}</div>
          <div class="entry-time-val">${formatTime(e.elapsedMs)}</div>
          <div class="entry-meta">${dateStr} · ${timeStr}</div>
          <div>
            <span class="entry-trigger">${escHtml(e.trigger)}</span>
            ${loc}
          </div>
        </div>`;
    }).join('');
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ─── Nav ─────────────────────────────────────────────────────────
  function showPage(name) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('nav button').forEach((b,i) => {
      b.classList.toggle('active', (['tracker','score'][i]) === name);
    });
    document.getElementById('page-' + name).classList.add('active');
    if (name === 'score') renderScore();
  }

  // ─── Init ────────────────────────────────────────────────────────
  getLocation();
  renderScore();
</script>
</body>
</html>
