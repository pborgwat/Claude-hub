<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Uit in Haarlem</title>
<meta name="description" content="Vandaag, vanavond en de komende week: film en podium in Haarlem.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151619" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Uit Haarlem">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap" rel="stylesheet">
<style>
  /* Stijl volgens de Hellotime style reference: monochroom, haarlijnen, geen schaduwen.
     Kleur alleen op de balkjes per zaal (zoals de tijdlijnbalken in de sheet). */
  :root {
    --ink: #151619;
    --smoke: #7f8491;
    --fog: #c8cad0;
    --ash: #e1e2e5;
    --mist: #f3f3f5;
    --paper: #ffffff;
    --charcoal: #25272d;
    --graphite: #363940;
    --pewter: #b0b3bb;
    --green: #059669;
    --gradient: linear-gradient(90deg, #0560fd 0%, #3a8dff 50%, #c3d9ff 100%);

    /* Zaalkleuren (eigen keuze van de gebruiker) */
    --v-pathe: #eab308;
    --v-filmkoepel: #059669;
    --v-patronaat: #dc2626;
    --v-schuur: #7c3aed;
    --v-liefde: #ec4899;
    --v-phil: #0560fd;
    --v-schouwburg: #ffffff;

    --bg: var(--paper);
    --card: var(--paper);
    --surface: var(--mist);
    --text: var(--ink);
    --muted: var(--smoke);
    --line: var(--fog);
    --divider: var(--ash);
    --action: var(--charcoal);
    --on-action: var(--paper);
    --ghost: var(--pewter);

    /* Op iPhone is dit het echte SF Pro uit de sheet; elders Inter */
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, sans-serif;
    --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", Roboto, sans-serif;
  }
  /* Donkere modus staat niet in de sheet: eigen afleiding met dezelfde grijzen */
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151619;
      --card: #1c1d21;
      --surface: #25272d;
      --text: #f3f3f5;
      --muted: #9a9fab;
      --line: #363940;
      --divider: #2c2e34;
      --action: #f3f3f5;
      --on-action: #151619;
      --ghost: #4a4d55;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 400 16px/1.5 var(--font);
    padding-bottom: env(safe-area-inset-bottom);
  }
  button { font: inherit; color: inherit; }

  header {
    position: sticky; top: 0; z-index: 3;
    background: var(--bg); border-bottom: 1px solid var(--line);
    padding: calc(env(safe-area-inset-top) + 14px) 0 12px;
  }
  h1 {
    margin: 0 16px 12px; font: 700 30px/1 var(--font-display); letter-spacing: -0.6px;
  }
  h1 .hl { background: var(--gradient); -webkit-background-clip: text; background-clip: text; color: transparent; }
  /* Zoekveld */
  .search { position: relative; margin: 0 16px 12px; }
  .search svg { position: absolute; left: 12px; top: 50%; width: 18px; height: 18px; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
  .search input {
    width: 100%; -webkit-appearance: none; appearance: none;
    font: 400 16px/1.25 var(--font); color: var(--text);
    padding: 10px 40px 10px 38px; border: 1px solid var(--divider); border-radius: 12px; background: var(--surface);
  }
  .search input::placeholder { color: var(--muted); }
  .search input:focus { outline: none; border-color: var(--ghost); background: var(--card); }
  .search input::-webkit-search-cancel-button { display: none; }
  .search .clear {
    position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
    width: 36px; height: 36px; border: 0; background: none; color: var(--muted); font-size: 20px; line-height: 1; cursor: pointer;
  }
  .search .clear[hidden] { display: none; }
  .searching .days, .searching #fromNow { display: none; }
  .res { margin-top: 16px; }
  .res-head { padding: 16px 20px 12px; }
  .res-head .title { margin: 0; }
  .res-head .info { margin-top: 2px; }
  .res-day { display: grid; grid-template-columns: 92px 1fr; gap: 12px; padding: 10px 20px; border-top: 1px solid var(--divider); align-items: start; }
  .res-day .d { font: 500 14px/32px var(--font); color: var(--muted); }
  .res-day .d b { color: var(--text); font-weight: 600; }
  .times { display: flex; flex-wrap: wrap; gap: 6px; }
  .tchip {
    display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border: 1px solid var(--line); border-radius: 8px;
    font: 500 15px/20px var(--font); font-feature-settings: "tnum" 1; color: var(--text); text-decoration: none;
  }
  .tchip i { width: 8px; height: 8px; border-radius: 2px; background: var(--vc); box-shadow: inset 0 0 0 1px rgba(21,22,25,.18); }
  .tchip.sold { text-decoration: line-through; color: var(--muted); }
  .tchip:active { background: var(--surface); }
  .note { margin-top: 12px; font-size: 14px; color: var(--muted); }
  .note button { border: 0; background: none; padding: 0; color: var(--text); text-decoration: underline; cursor: pointer; font: inherit; }
  .days {
    display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x proximity; scroll-padding: 0 16px;
    padding: 0 16px; scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  .days::-webkit-scrollbar { display: none; }
  .days button {
    flex: 0 0 auto; min-width: 84px; scroll-snap-align: start;
    border: 1px solid var(--divider); border-radius: 8px; padding: 7px 12px;
    background: transparent; cursor: pointer; text-align: left;
    font: 600 15px/1.2 var(--font);
  }
  .days button small { display: block; font: 400 12px/1.3 var(--font); color: var(--muted); margin-top: 1px; }
  .days button[aria-pressed="true"] { background: var(--action); border-color: var(--action); color: var(--on-action); }
  .days button[aria-pressed="true"] small { color: inherit; opacity: .7; }

  .toggles { display: flex; gap: 8px; align-items: center; padding: 10px 16px 0; flex-wrap: wrap; }
  .chip {
    border: 1px solid var(--ghost); border-radius: 9999px; padding: 5px 12px; background: transparent; cursor: pointer;
    font: 500 13px/1.3 var(--font); display: inline-flex; align-items: center; gap: 6px; color: var(--muted);
  }
  .chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid currentColor; }
  .chip[aria-pressed="true"] { background: var(--action); border-color: var(--action); color: var(--on-action); }
  .chip[aria-pressed="true"]::before { background: currentColor; }
  .chip[hidden] { display: none; }
  #count { margin-left: auto; font: 500 13px/1.3 var(--font); color: var(--muted); }

  main { max-width: 640px; margin: 0 auto; padding: 8px 16px 48px; }
  h2 { margin: 32px 0 4px; font: 700 24px/1.2 var(--font-display); letter-spacing: -0.3px; }
  h2 small { display: block; font: 400 14px/1.5 var(--font); letter-spacing: 0; color: var(--muted); margin-top: 2px; }
  h3.slot { margin: 20px 0 8px; font: 500 14px/1.5 var(--font); color: var(--muted); }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  .row { display: flex; align-items: stretch; border-top: 1px solid var(--divider); }
  .row:first-child { border-top: 0; }
  .row > a {
    flex: 1; min-width: 0; display: grid; grid-template-columns: 4px 44px 1fr; gap: 12px;
    padding: 14px 0 14px 12px; color: inherit; text-decoration: none;
  }
  .row > a:active { background: var(--surface); }
  .row.past { opacity: .45; }
  /* Het zaalbalkje: 4px breed, 4px radius, zoals de tijdlijnbalken */
  .bar { border-radius: 4px; background: var(--vc, var(--smoke)); box-shadow: inset 0 0 0 1px rgba(21,22,25,.12); }
  .time { font: 500 15px/24px var(--font); font-feature-settings: "tnum" 1; color: var(--muted); margin-top: 18px; }
  .venue { font: 500 12px/1.33 var(--font); color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .venue i { width: 8px; height: 8px; border-radius: 2px; background: var(--vc, var(--smoke)); flex: none; box-shadow: inset 0 0 0 1px rgba(21,22,25,.18); }
  .title { font: 700 18px/24px var(--font); letter-spacing: -0.2px; margin-top: 2px; }
  .info { color: var(--muted); font-size: 14px; line-height: 1.4; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .sold { border: 1px solid currentColor; border-radius: 9999px; padding: 0 7px; color: var(--text); font-size: 11px; }
  .share {
    flex: 0 0 48px; border: 0; background: none; color: var(--muted); cursor: pointer; padding: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .share:active { color: var(--text); }
  .share svg { width: 20px; height: 20px; }

  .dark-card {
    display: block; margin-top: 16px; padding: 20px 24px 24px; border-radius: 16px;
    background: var(--charcoal); color: var(--paper);
  }
  @media (prefers-color-scheme: dark) { .dark-card { background: var(--surface); border: 1px solid var(--line); } }
  .dark-card .venue { color: rgba(255,255,255,.7); }
  .dark-card .t { font: 700 20px/1.33 var(--font-display); margin: 8px 0 4px; }
  .dark-card .m { font-size: 14px; color: rgba(255,255,255,.7); }
  .links { display: grid; gap: 8px; margin-top: 16px; }
  .btn {
    display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 8px;
    background: var(--paper); color: var(--ink); font: 600 15px/1.2 var(--font); text-decoration: none;
  }
  .btn i { width: 10px; height: 10px; border-radius: 3px; background: var(--vc); box-shadow: inset 0 0 0 1px rgba(21,22,25,.25); flex: none; }
  .btn span { margin-left: auto; color: var(--smoke); font-weight: 500; }
  .empty { padding: 20px 24px; color: var(--muted); font-size: 15px; }

  footer { margin-top: 40px; padding: 24px; border-radius: 16px; background: var(--surface); font-size: 14px; line-height: 1.5; color: var(--muted); }
  footer b { font-weight: 600; color: var(--text); }
  footer .warn { color: var(--text); border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 8px 12px; margin: 10px 0; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 14px; }
  .legend a { color: var(--text); text-decoration: none; display: inline-flex; align-items: center; gap: 6px; font: 500 13px/1.3 var(--font); }
  .legend i { width: 10px; height: 10px; border-radius: 3px; background: var(--vc); box-shadow: inset 0 0 0 1px rgba(21,22,25,.18); }
  /* Ingeklapte dagdelen (films overdag) */
  details.slot-fold { margin-top: 20px; }
  details.slot-fold > summary {
    list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px;
    padding: 12px 16px; border: 1px solid var(--line); border-radius: 16px;
    font: 500 14px/1.5 var(--font); color: var(--muted);
  }
  details.slot-fold > summary::-webkit-details-marker { display: none; }
  details.slot-fold > summary .n { margin-left: auto; }
  details.slot-fold > summary::after { content: "›"; font-size: 18px; line-height: 1; transition: transform .15s; }
  details.slot-fold[open] > summary { border-color: transparent; padding: 0; margin-bottom: 8px; }
  details.slot-fold[open] > summary::after { transform: rotate(90deg); }
  /* Actiemenu onder de deelknop */
  .sheet-bg { position: fixed; inset: 0; z-index: 20; background: rgba(21,22,25,.4); display: flex; align-items: flex-end; justify-content: center; }
  .sheet-menu {
    width: 100%; max-width: 640px; background: var(--card); color: var(--text); border-radius: 16px 16px 0 0; border-top: 1px solid var(--line);
    padding: 20px 16px calc(env(safe-area-inset-bottom) + 16px); display: grid; gap: 8px;
  }
  .sheet-menu .t { font: 700 18px/24px var(--font); letter-spacing: -0.2px; }
  .sheet-menu .m { font-size: 14px; color: var(--muted); margin-bottom: 8px; }
  .sheet-menu .act {
    display: flex; align-items: center; gap: 10px; width: 100%; padding: 14px 16px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--line); background: var(--card); color: var(--text); font: 600 16px/1.2 var(--font); text-decoration: none;
  }
  .sheet-menu .act.primary { background: var(--action); border-color: var(--action); color: var(--on-action); }
  .sheet-menu .act svg { width: 20px; height: 20px; flex: none; }
  .sheet-menu .act small { margin-left: auto; font: 500 13px/1.2 var(--font); opacity: .7; }
  .sheet-menu .cancel { border: 0; background: none; padding: 12px; font: 500 16px/1.2 var(--font); color: var(--muted); cursor: pointer; }
  .toast {
    position: fixed; z-index: 10; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 24px); transform: translateX(-50%);
    background: var(--action); color: var(--on-action); padding: 10px 18px; border-radius: 8px; font: 500 14px/1.2 var(--font);
    opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <h1>Uit in <span class="hl">Haarlem</span></h1>
  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Zoek een film of voorstelling" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search" aria-label="Zoeken">
    <button class="clear" id="clearQ" aria-label="Zoekveld leegmaken" hidden>×</button>
  </div>
  <div class="days" id="days"></div>
  <div class="toggles">
    <button class="chip" id="fromNow" aria-pressed="true">Alleen wat nog komt</button>
    <button class="chip" id="showPathe" aria-pressed="false">Pathé</button>
    <span id="count"></span>
  </div>
</header>
<main id="app"><div class="card"><div class="empty">Agenda laden...</div></div></main>
<div class="toast" id="toast"></div>

<script>
const VENUE_SITES = {
  Filmkoepel: 'https://filmkoepel.nl/agenda/',
  Schuur: 'https://www.schuur.nl/agenda',
  'Pathé': 'https://www.pathe.nl/nl/bioscopen/pathe-haarlem',
  Phil: 'https://philhaarlem.nl/agenda',
  Patronaat: 'https://patronaat.nl/programma/',
  'De Liefde': 'https://theaterdeliefde.nl/agenda/',
  Stadsschouwburg: 'https://stadsschouwburghaarlem.nl/agenda',
};
const VENUE_COLORS = {
  Filmkoepel: 'var(--v-filmkoepel)',
  Schuur: 'var(--v-schuur)',
  'Pathé': 'var(--v-pathe)',
  Phil: 'var(--v-phil)',
  Patronaat: 'var(--v-patronaat)',
  'De Liefde': 'var(--v-liefde)',
  Stadsschouwburg: 'var(--v-schouwburg)',
};
// Zalen waarvan de agenda niet automatisch op te halen is: alleen een directe link
const LINK_ONLY = ['Stadsschouwburg', 'De Liefde'];
const NUM_DAYS = 7;
const DAYNAMES = ['zo', 'ma', 'di', 'wo', 'do', 'vr', 'za'];
const DAYFULL = ['Zondag', 'Maandag', 'Dinsdag', 'Woensdag', 'Donderdag', 'Vrijdag', 'Zaterdag'];
const MONTHNAMES = ['jan', 'feb', 'mrt', 'apr', 'mei', 'jun', 'jul', 'aug', 'sep', 'okt', 'nov', 'dec'];
const SHARE_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M8 7l4-4 4 4"/><path d="M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></svg>';

const pad = (n) => String(n).padStart(2, '0');
const isoDate = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const esc = (s = '') => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const vc = (v) => `--vc:${VENUE_COLORS[v] || 'var(--smoke)'}`;

const store = {
  get(k, def) { try { const v = localStorage.getItem(k); return v === null ? def : JSON.parse(v); } catch { return def; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

let data = null;
let dayIndex = 0;
let fromNow = true;
let showPathe = store.get('uitagenda.pathe', false);
let rendered = []; // events op het scherm, voor de deelknoppen
let query = '';

// Zoeken zonder hoofdletters en accenten: "pathe" vindt ook "Pathé"
const norm = (s = '') => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();

function days() {
  const base = new Date();
  return Array.from({ length: NUM_DAYS }, (_, i) => {
    const d = new Date(base.getFullYear(), base.getMonth(), base.getDate() + i);
    const label = i === 0 ? 'Vandaag' : i === 1 ? 'Morgen' : DAYFULL[d.getDay()];
    return { iso: isoDate(d), label, sub: `${DAYNAMES[d.getDay()]} ${d.getDate()} ${MONTHNAMES[d.getMonth()]}` };
  });
}

// Is een voorstelling al (ruim) begonnen? Films 10 min speling, podium 30 min.
function isPast(ev) {
  if (!ev.time || ev.date !== isoDate(new Date())) return false;
  const [h, m] = ev.time.split(':').map(Number);
  const start = new Date(); start.setHours(h, m, 0, 0);
  // Tijden na middernacht (bijv. clubnacht 00:30) horen bij de avond ervoor
  if (h < 5) start.setDate(start.getDate() + 1);
  const grace = (ev.kind === 'film' ? 10 : 30) * 60000;
  return Date.now() > start.getTime() + grace;
}

function slotOf(time) {
  if (!time) return 'Hele dag';
  const h = Number(time.slice(0, 2));
  if (h < 5) return 'Nacht';
  if (h < 12) return 'Ochtend';
  if (h < 18) return 'Middag';
  return 'Avond';
}

function renderDays() {
  const el = document.getElementById('days');
  el.innerHTML = days().map((d, i) =>
    `<button aria-pressed="${i === dayIndex}" data-i="${i}">${d.label}<small>${d.sub}</small></button>`).join('');
  el.querySelectorAll('button').forEach((b) => b.onclick = () => { dayIndex = Number(b.dataset.i); render(); window.scrollTo(0, 0); });
  document.getElementById('fromNow').hidden = dayIndex !== 0;
  document.getElementById('fromNow').setAttribute('aria-pressed', fromNow);
  document.getElementById('showPathe').setAttribute('aria-pressed', showPathe);
}

// Bij films is het zaalnummer ("Zaal 4") niet relevant
const filmInfo = (info = '') => info.split(' · ').filter((p) => !/^zaal\s*\d+$/i.test(p.trim())).join(' · ');

function row(ev, past) {
  const i = rendered.push(ev) - 1;
  const info = ev.kind === 'film' ? filmInfo(ev.info) : ev.info;
  return `<div class="row${past ? ' past' : ''}" style="${vc(ev.venue)}">
    <a href="${esc(ev.url)}" target="_blank" rel="noopener">
      <span class="bar" aria-hidden="true"></span>
      <div class="time">${ev.time || '—'}</div>
      <div>
        <div class="venue"><i></i>${esc(ev.venue)}${ev.soldOut ? ' <span class="sold">uitverkocht</span>' : ''}</div>
        <div class="title">${esc(ev.title)}</div>
        ${info ? `<div class="info">${esc(info)}</div>` : ''}
      </div>
    </a>
    <button class="share" data-share="${i}" aria-label="Delen of loggen: ${esc(ev.title)}">${SHARE_ICON}</button>
  </div>`;
}

// Dagdelen die je zelf hebt opengeklapt blijven open tot je de app herlaadt
const openFolds = new Set();

function section(title, sub, list, emptyText, pastFn = () => false, foldSlots = []) {
  let html = `<h2>${title}<small>${sub}</small></h2>`;
  if (!list.length) return html + `<div class="card" style="margin-top:12px"><div class="empty">${emptyText}</div></div>`;
  const groups = [];
  // Zonder aanvangstijd ("hele dag") bovenaan
  const ordered = [...list.filter((e) => !e.time), ...list.filter((e) => e.time)];
  for (const ev of ordered) {
    const slot = slotOf(ev.time);
    if (!groups.length || groups.at(-1).slot !== slot) groups.push({ slot, items: [] });
    groups.at(-1).items.push(ev);
  }
  for (const g of groups) {
    const card = `<div class="card">${g.items.map((ev) => row(ev, pastFn(ev))).join('')}</div>`;
    if (foldSlots.includes(g.slot)) {
      const key = title + g.slot;
      html += `<details class="slot-fold" data-fold="${esc(key)}"${openFolds.has(key) ? ' open' : ''}>
        <summary>${g.slot}<span class="n">${g.items.length} ${g.items.length === 1 ? 'film' : 'films'}</span></summary>${card}</details>`;
    } else {
      html += `<h3 class="slot">${g.slot}</h3>${card}`;
    }
  }
  return html;
}

function dayLabel(iso) {
  const d = days().find((x) => x.iso === iso);
  if (d) return d.label === 'Vandaag' || d.label === 'Morgen' ? `<b>${d.label}</b><br>${d.sub}` : `<b>${d.sub}</b>`;
  const [y, m, dd] = iso.split('-').map(Number);
  const dt = new Date(y, m - 1, dd);
  return `<b>${DAYNAMES[dt.getDay()]} ${dd} ${MONTHNAMES[m - 1]}</b>`;
}

// Zoekresultaten: per titel alle dagen met aanvangstijden, ongeacht de gekozen dag
function renderSearch() {
  const q = norm(query);
  const today = isoDate(new Date());
  const all = data.events.filter((e) => e.date >= today && !LINK_ONLY.includes(e.venue) && !isPast(e) && norm(e.title).includes(q));
  const visible = all.filter((e) => showPathe || e.venue !== 'Pathé');
  const hiddenPathe = all.length - visible.length;

  const groups = new Map();
  for (const ev of visible) {
    const key = norm(ev.title);
    if (!groups.has(key)) groups.set(key, { title: ev.title, kind: ev.kind, items: [] });
    groups.get(key).items.push(ev);
  }
  document.getElementById('count').textContent = `${groups.size} ${groups.size === 1 ? 'titel' : 'titels'}`;

  let html = '';
  if (!groups.size) {
    html += `<div class="card res"><div class="empty">Niets gevonden voor “${esc(query)}” in de komende week.</div></div>`;
  }
  for (const g of groups.values()) {
    const venues = [...new Set(g.items.map((e) => e.venue))];
    const byDay = new Map();
    for (const ev of g.items) {
      if (!byDay.has(ev.date)) byDay.set(ev.date, []);
      byDay.get(ev.date).push(ev);
    }
    const first = g.items[0];
    const info = first.kind === 'film' ? filmInfo(first.info) : first.info;
    html += `<div class="card res">
      <div class="res-head">
        <div class="title">${esc(g.title)}</div>
        <div class="info">${esc([venues.join(', '), info].filter(Boolean).join(' · '))}</div>
      </div>
      ${[...byDay.entries()].map(([date, evs]) => `<div class="res-day">
        <div class="d">${dayLabel(date)}</div>
        <div class="times">${evs.map((e) => `<a class="tchip${e.soldOut ? ' sold' : ''}" href="${esc(e.url)}" target="_blank" rel="noopener" style="${vc(e.venue)}" title="${esc(e.venue)}"><i></i>${e.time || 'hele dag'}</a>`).join('')}</div>
      </div>`).join('')}
    </div>`;
  }
  if (hiddenPathe) {
    html += `<div class="note">Nog ${hiddenPathe} ${hiddenPathe === 1 ? 'voorstelling' : 'voorstellingen'} in Pathé. <button id="patheOn">Pathé tonen</button></div>`;
  }
  document.getElementById('app').innerHTML = html;
}

function render() {
  renderDays();
  document.body.classList.toggle('searching', query.length >= 2);
  if (!data) return;
  rendered = [];
  if (query.length >= 2) return renderSearch();
  const day = days()[dayIndex];
  const onlyUpcoming = dayIndex === 0 && fromNow;
  const events = data.events.filter((e) => e.date === day.iso && !(onlyUpcoming && isPast(e)));
  const podium = events.filter((e) => e.kind !== 'film' && !LINK_ONLY.includes(e.venue));
  const films = events.filter((e) => e.kind === 'film' && (showPathe || e.venue !== 'Pathé'));
  document.getElementById('count').textContent = `${podium.length} podium · ${films.length} film`;

  const cinemas = showPathe ? 'Filmkoepel, Schuur of Pathé' : 'Filmkoepel of Schuur';
  let html = section('Podium', 'Theater, concerten en clubs', podium, 'Niets gevonden bij Phil, Patronaat of Schuur.', isPast);
  html += `<div class="dark-card">
    <div class="t">Ook kijken bij</div>
    <div class="m">Deze zalen laten geen automatisch ophalen toe, daarom een directe link naar hun agenda.</div>
    <div class="links">${LINK_ONLY.map((v) =>
      `<a class="btn" href="${VENUE_SITES[v]}" target="_blank" rel="noopener" style="${vc(v)}"><i></i>${v}<span>agenda →</span></a>`).join('')}</div>
  </div>`;
  html += section('Film', showPathe ? 'Filmkoepel, Schuur en Pathé' : 'Filmkoepel en Schuur', films,
    `Geen voorstellingen gevonden bij ${cinemas}. Het nieuwe filmprogramma verschijnt meestal pas op maandag of dinsdag.`, isPast,
    ['Ochtend', 'Middag']);

  const updated = new Date(data.generated);
  const failed = Object.entries(data.status || {}).filter(([n, s]) => !s.ok && !LINK_ONLY.includes(n)).map(([n]) => n);
  const covered = (data.days || []).includes(day.iso);
  html += `<footer>
    <b>Bijgewerkt ${updated.toLocaleString('nl-NL', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })}</b>
    ${failed.length ? `<div class="warn">Laatste update mislukt voor: ${failed.join(', ')} (oude gegevens getoond)</div>` : ''}
    ${!covered ? `<div class="warn">Voor deze dag zijn nog geen gegevens opgehaald.</div>` : ''}
    <br>Tijden onder voorbehoud, check altijd de site van de zaal. Pathé via Filmladder.
    <div class="legend">${Object.entries(VENUE_SITES).map(([n, u]) => `<a href="${u}" target="_blank" rel="noopener" style="${vc(n)}"><i></i>${n}</a>`).join('')}</div>
  </footer>`;
  document.getElementById('app').innerHTML = html;
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

async function share(ev) {
  const [y, m, d] = ev.date.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  const when = `${DAYNAMES[dt.getDay()]} ${d} ${MONTHNAMES[m - 1]}${ev.time ? ' ' + ev.time : ''}`;
  const text = `${ev.title} - ${ev.venue}, ${when}`;
  if (navigator.share) {
    try { await navigator.share({ title: ev.title, text, url: ev.url }); } catch {}
    return;
  }
  try { await navigator.clipboard.writeText(`${text}\n${ev.url}`); toast('Link gekopieerd'); }
  catch { prompt('Kopieer de link:', ev.url); }
}

// Doorsturen naar culturelogd: opent het formulier daar, al ingevuld
const CULTURELOGD = 'https://culturelogd.nl/';
const LOG_VENUE = { 'Pathé': 'Pathé Haarlem', 'Phil': 'Phil Haarlem' };
function logKind(ev) {
  if (ev.kind === 'film') return 'film';
  if (ev.venue === 'Patronaat' || ev.venue === 'Phil') return 'concert';
  return 'theater';
}
function logURL(ev) {
  const kind = logKind(ev);
  // "Artiest • Andere zaal": dan is die zaal de locatie
  const [title, elsewhere] = ev.title.split(' • ');
  const venue = elsewhere || LOG_VENUE[ev.venue] || ev.venue;
  const q = new URLSearchParams({ nieuw: '', soort: kind, titel: title, locatie: venue, datum: ev.date });
  if (ev.time) q.set('tijd', ev.time);
  // Bij theater in de Schuur staat het gezelschap als tweede deel in de info
  const maker = kind === 'theater' ? (ev.info || '').split(' · ')[1] : '';
  if (maker) q.set('maker', maker);
  return CULTURELOGD + '?' + q.toString().replace('nieuw=&', 'nieuw&');
}
const LOG_ICON = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.6l2.83 5.97 6.53.74-4.86 4.45 1.32 6.46L12 16.95l-5.82 3.27 1.32-6.46-4.86-4.45 6.53-.74z"/></svg>';
function openActions(ev) {
  const bg = document.createElement('div');
  bg.className = 'sheet-bg';
  bg.innerHTML = `<div class="sheet-menu" role="dialog" aria-modal="true" aria-label="${esc(ev.title)}">
    <div class="t">${esc(ev.title)}</div>
    <div class="m">${esc(ev.venue)}${ev.time ? ' · ' + esc(ev.time) : ''}</div>
    <button class="act" data-act="share">${SHARE_ICON}Delen</button>
    <a class="act primary" data-act="log" href="${esc(logURL(ev))}" target="_blank" rel="noopener">${LOG_ICON}Log in culturelogd<small>opent Safari</small></a>
    <button class="cancel" data-act="cancel">Annuleer</button>
  </div>`;
  const close = () => bg.remove();
  bg.addEventListener('click', (e) => {
    const a = e.target.closest('[data-act]');
    if (!a && e.target !== bg) return;
    if (a?.dataset.act === 'share') { close(); share(ev); return; }
    close();
  });
  document.body.appendChild(bg);
}

document.getElementById('app').addEventListener('toggle', (e) => {
  const d = e.target.closest?.('details[data-fold]');
  if (d) d.open ? openFolds.add(d.dataset.fold) : openFolds.delete(d.dataset.fold);
}, true);
document.getElementById('app').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-share]');
  if (btn) openActions(rendered[Number(btn.dataset.share)]);
});
document.getElementById('fromNow').onclick = () => { fromNow = !fromNow; render(); };
const togglePathe = () => { showPathe = !showPathe; store.set('uitagenda.pathe', showPathe); render(); };
document.getElementById('showPathe').onclick = togglePathe;
document.getElementById('app').addEventListener('click', (e) => { if (e.target.id === 'patheOn') togglePathe(); });

const qInput = document.getElementById('q');
const clearBtn = document.getElementById('clearQ');
qInput.addEventListener('input', () => {
  query = qInput.value.trim();
  clearBtn.hidden = !qInput.value;
  render();
});
qInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') qInput.blur(); });
clearBtn.onclick = () => { qInput.value = ''; query = ''; clearBtn.hidden = true; render(); qInput.focus(); };

async function load() {
  try {
    const res = await fetch('events.json?t=' + Date.now(), { cache: 'no-store' });
    data = await res.json();
  } catch (e) {
    if (!data) document.getElementById('app').innerHTML = '<div class="card"><div class="empty">Kon de agenda niet laden. Heb je internet?</div></div>';
    return;
  }
  render();
}

renderDays();
load();
// Bij terugkeren naar de app: opnieuw laden en "wat nog komt" bijwerken
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
setInterval(render, 5 * 60000);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
