<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Uit in Haarlem</title>
<meta name="description" content="Vandaag, vanavond en de komende week: film en podium in Haarlem.">
<meta name="theme-color" content="#1f1b2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Uit Haarlem">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root {
    --bg: #f6f1e7;
    --card: #fffaf1;
    --ink: #1f1b2e;
    --muted: #6d6778;
    --line: #e4dccd;
    --accent: #e8553d;
    --sun: #f2b84b;
    --head: #1f1b2e;
    --head-ink: #fff8ec;
    --chip: #efe6d6;
    --v-filmkoepel: #3d7a6b;
    --v-schuur: #b04a2f;
    --v-phil: #6b3d6e;
    --v-patronaat: #2f5d9a;
    --v-schouwburg: #8a6a1f;
    --v-liefde: #a8326b;
    --v-pathe: #5c5a14;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15121f;
      --card: #1f1b2e;
      --ink: #f3ede2;
      --muted: #a39cae;
      --line: #322c44;
      --chip: #2b253d;
      --head: #0e0c16;
      --v-filmkoepel: #6fbfa9;
      --v-schuur: #f08a68;
      --v-phil: #c795ca;
      --v-patronaat: #86aee6;
      --v-schouwburg: #dbb45a;
      --v-liefde: #ec8bb8;
      --v-pathe: #cfcb6a;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.4 var(--font);
    padding-bottom: env(safe-area-inset-bottom);
  }
  header {
    position: sticky; top: 0; z-index: 5;
    background: var(--head); color: var(--head-ink);
    padding: calc(env(safe-area-inset-top) + 12px) 0 10px;
  }
  h1 { margin: 0 16px 10px; font: 700 22px/1.1 Georgia, "Times New Roman", serif; letter-spacing: .2px; }
  h1 span { color: var(--sun); }
  .days {
    display: flex; gap: 6px; overflow-x: auto; scroll-snap-type: x proximity; scroll-padding: 0 16px;
    padding: 0 16px; scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  .days::-webkit-scrollbar { display: none; }
  .days button {
    flex: 0 0 auto; min-width: 88px; scroll-snap-align: start;
    border: 0; border-radius: 10px; padding: 8px 10px;
    background: rgba(255,255,255,.08); color: var(--head-ink);
    font: 600 15px/1.1 var(--font); cursor: pointer;
  }
  .days button small { display: block; font-weight: 400; opacity: .7; font-size: 12px; margin-top: 2px; }
  .days button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .opts { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; margin: 8px 16px 0; font-size: 13px; opacity: .85; }
  .opts label { display: flex; align-items: center; gap: 6px; }
  .opts #count { margin-left: auto; }
  main { max-width: 640px; margin: 0 auto; padding: 4px 16px 32px; }
  h2 {
    font: 700 13px/1 var(--font); text-transform: uppercase; letter-spacing: 1.2px;
    color: var(--muted); margin: 22px 0 8px;
  }
  h3.slot { font: 600 12px/1 var(--font); color: var(--muted); margin: 14px 0 6px; }
  .list { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .row { display: flex; align-items: stretch; border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; }
  .row > a {
    flex: 1; min-width: 0; display: grid; grid-template-columns: 52px 1fr; gap: 10px;
    padding: 11px 0 11px 12px; color: inherit; text-decoration: none;
  }
  .row > a:active { background: var(--chip); }
  .row.past { opacity: .45; }
  .share {
    flex: 0 0 48px; border: 0; background: none; color: var(--muted);
    display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0;
  }
  .share:active { color: var(--accent); }
  .share svg { width: 21px; height: 21px; }
  .time { font: 700 16px/1.25 var(--font); font-variant-numeric: tabular-nums; }
  .title { font-weight: 600; line-height: 1.25; }
  .info { color: var(--muted); font-size: 13px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .venue { font: 700 11px/1 var(--font); text-transform: uppercase; letter-spacing: .6px; margin-bottom: 3px; }
  .v-Filmkoepel { color: var(--v-filmkoepel); }
  .v-Schuur { color: var(--v-schuur); }
  .v-Phil { color: var(--v-phil); }
  .v-Patronaat { color: var(--v-patronaat); }
  .v-Stadsschouwburg { color: var(--v-schouwburg); }
  .v-DeLiefde { color: var(--v-liefde); }
  .v-Pathe { color: var(--v-pathe); }
  .sold { color: var(--accent); font-weight: 600; }
  .link-card {
    display: block; padding: 12px; margin-top: 8px;
    background: var(--card); border: 1px dashed var(--line); border-radius: 14px;
    color: inherit; text-decoration: none; font-size: 14px;
  }
  .link-card .muted { color: var(--muted); font-size: 13px; }
  .empty { padding: 14px 12px; color: var(--muted); font-size: 14px; }
  footer { color: var(--muted); font-size: 12px; text-align: center; margin-top: 28px; line-height: 1.7; }
  footer a { color: inherit; }
  footer .warn { color: var(--accent); }
  .loading { padding: 40px 0; text-align: center; color: var(--muted); }
  .toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 20px); transform: translateX(-50%);
    background: var(--ink); color: var(--bg); padding: 9px 14px; border-radius: 10px; font-size: 14px;
    opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <h1>Uit in <span>Haarlem</span></h1>
  <div class="days" id="days"></div>
  <div class="opts">
    <label id="fromNowLabel"><input type="checkbox" id="fromNow" checked> alleen wat nog komt</label>
    <label><input type="checkbox" id="showPathe"> Pathé tonen</label>
    <span id="count"></span>
  </div>
</header>
<main id="app"><div class="loading">Agenda laden...</div></main>
<div class="toast" id="toast"></div>

<script>
const VENUE_SITES = {
  Filmkoepel: 'https://filmkoepel.nl/agenda/',
  Schuur: 'https://www.schuur.nl/agenda',
  'Pathé': 'https://www.pathe.nl/nl/bioscopen/pathe-haarlem',
  Phil: 'https://philhaarlem.nl/agenda',
  Patronaat: 'https://patronaat.nl/programma/',
  'De Liefde': 'https://theaterdeliefde.nl/agenda/',
  Stadsschouwburg: 'https://stadsschouwburghaarlem.nl/agenda',
};
const NUM_DAYS = 7;
const DAYNAMES = ['zo', 'ma', 'di', 'wo', 'do', 'vr', 'za'];
const DAYFULL = ['Zondag', 'Maandag', 'Dinsdag', 'Woensdag', 'Donderdag', 'Vrijdag', 'Zaterdag'];
const MONTHNAMES = ['jan', 'feb', 'mrt', 'apr', 'mei', 'jun', 'jul', 'aug', 'sep', 'okt', 'nov', 'dec'];
const SHARE_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M8 7l4-4 4 4"/><path d="M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></svg>';

const pad = (n) => String(n).padStart(2, '0');
const isoDate = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const esc = (s = '') => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const venueClass = (v) => 'v-' + v.normalize('NFD').replace(/[^A-Za-z]/g, '');

const store = {
  get(k, def) { try { const v = localStorage.getItem(k); return v === null ? def : JSON.parse(v); } catch { return def; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

let data = null;
let dayIndex = 0;
let fromNow = true;
let showPathe = store.get('uitagenda.pathe', false);
let rendered = []; // events op het scherm, voor de deelknoppen

function days() {
  const base = new Date();
  return Array.from({ length: NUM_DAYS }, (_, i) => {
    const d = new Date(base.getFullYear(), base.getMonth(), base.getDate() + i);
    const label = i === 0 ? 'Vandaag' : i === 1 ? 'Morgen' : DAYFULL[d.getDay()];
    return { iso: isoDate(d), label, sub: `${DAYNAMES[d.getDay()]} ${d.getDate()} ${MONTHNAMES[d.getMonth()]}` };
  });
}

// Is een voorstelling al (ruim) begonnen? Films 10 min speling, podium 30 min.
function isPast(ev) {
  if (!ev.time || ev.date !== isoDate(new Date())) return false;
  const [h, m] = ev.time.split(':').map(Number);
  const start = new Date(); start.setHours(h, m, 0, 0);
  // Tijden na middernacht (bijv. clubnacht 00:30) horen bij de avond ervoor
  if (h < 5) start.setDate(start.getDate() + 1);
  const grace = (ev.kind === 'film' ? 10 : 30) * 60000;
  return Date.now() > start.getTime() + grace;
}

function slotOf(time) {
  if (!time) return 'Hele dag';
  const h = Number(time.slice(0, 2));
  if (h < 5) return 'Nacht';
  if (h < 12) return 'Ochtend';
  if (h < 18) return 'Middag';
  return 'Vanavond';
}

function renderDays() {
  const el = document.getElementById('days');
  el.innerHTML = days().map((d, i) =>
    `<button aria-pressed="${i === dayIndex}" data-i="${i}">${d.label}<small>${d.sub}</small></button>`).join('');
  el.querySelectorAll('button').forEach((b) => b.onclick = () => { dayIndex = Number(b.dataset.i); render(); window.scrollTo(0, 0); });
  document.getElementById('fromNowLabel').style.display = dayIndex === 0 ? '' : 'none';
}

function row(ev, past) {
  const i = rendered.push(ev) - 1;
  return `<div class="row${past ? ' past' : ''}">
    <a href="${esc(ev.url)}" target="_blank" rel="noopener">
      <div class="time">${ev.time || '—'}</div>
      <div>
        <div class="venue ${venueClass(ev.venue)}">${esc(ev.venue)}${ev.soldOut ? ' · <span class="sold">uitverkocht</span>' : ''}</div>
        <div class="title">${esc(ev.title)}</div>
        ${ev.info ? `<div class="info">${esc(ev.info)}</div>` : ''}
      </div>
    </a>
    <button class="share" data-share="${i}" aria-label="Deel ${esc(ev.title)}">${SHARE_ICON}</button>
  </div>`;
}

function section(title, list, emptyText, pastFn = () => false) {
  let html = `<h2>${title}</h2>`;
  if (!list.length) return html + `<div class="list"><div class="empty">${emptyText}</div></div>`;
  let last = '';
  for (const ev of list) {
    const slot = slotOf(ev.time);
    if (slot !== last) {
      if (last) html += '</div>';
      html += `<h3 class="slot">${slot}</h3><div class="list">`;
      last = slot;
    }
    html += row(ev, pastFn(ev));
  }
  return html + '</div>';
}

function render() {
  renderDays();
  if (!data) return;
  rendered = [];
  const day = days()[dayIndex];
  const onlyUpcoming = dayIndex === 0 && fromNow;
  const events = data.events.filter((e) => e.date === day.iso && !(onlyUpcoming && isPast(e)));
  const podium = events.filter((e) => e.kind !== 'film');
  const films = events.filter((e) => e.kind === 'film' && (showPathe || e.venue !== 'Pathé'));
  document.getElementById('count').textContent = `${podium.length} podium · ${films.length} film`;

  const cinemas = showPathe ? 'Filmkoepel, Schuur of Pathé' : 'Filmkoepel of Schuur';
  let html = section('Podium: theater, concerten, clubs', podium, 'Niets gevonden bij Phil, Patronaat, De Liefde of Schuur.', isPast);
  html += `<a class="link-card" href="${VENUE_SITES.Stadsschouwburg}" target="_blank" rel="noopener">
    <div class="venue v-Stadsschouwburg">Stadsschouwburg</div>
    Bekijk de agenda op de site van de Stadsschouwburg &rarr;
    <div class="muted">Hun site laat geen automatisch ophalen toe, daarom hier een directe link.</div>
  </a>`;
  html += section('Film', films, `Geen voorstellingen gevonden bij ${cinemas}. Het nieuwe filmprogramma verschijnt meestal pas op maandag of dinsdag.`, isPast);

  const updated = new Date(data.generated);
  const failed = Object.entries(data.status || {}).filter(([, s]) => !s.ok).map(([n]) => n);
  const covered = (data.days || []).includes(day.iso);
  html += `<footer>
    Bijgewerkt ${updated.toLocaleString('nl-NL', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })}
    ${failed.length ? `<br><span class="warn">Laatste update mislukt voor: ${failed.join(', ')} (oude gegevens getoond)</span>` : ''}
    ${!covered ? `<br><span class="warn">Voor deze dag zijn nog geen gegevens opgehaald.</span>` : ''}
    <br>Tijden onder voorbehoud, check altijd de site van de zaal.
    <br>De Liefde via Podiuminfo, Pathé via Filmladder.
    <br>${Object.entries(VENUE_SITES).map(([n, u]) => `<a href="${u}" target="_blank" rel="noopener">${n}</a>`).join(' · ')}
  </footer>`;
  document.getElementById('app').innerHTML = html;
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

async function share(ev) {
  const [y, m, d] = ev.date.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  const when = `${DAYNAMES[dt.getDay()]} ${d} ${MONTHNAMES[m - 1]}${ev.time ? ' ' + ev.time : ''}`;
  const text = `${ev.title} - ${ev.venue}, ${when}`;
  if (navigator.share) {
    try { await navigator.share({ title: ev.title, text, url: ev.url }); } catch {}
    return;
  }
  try { await navigator.clipboard.writeText(`${text}\n${ev.url}`); toast('Link gekopieerd'); }
  catch { prompt('Kopieer de link:', ev.url); }
}

document.getElementById('app').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-share]');
  if (btn) share(rendered[Number(btn.dataset.share)]);
});
document.getElementById('fromNow').onchange = (e) => { fromNow = e.target.checked; render(); };
const patheBox = document.getElementById('showPathe');
patheBox.checked = showPathe;
patheBox.onchange = (e) => { showPathe = e.target.checked; store.set('uitagenda.pathe', showPathe); render(); };

async function load() {
  try {
    const res = await fetch('events.json?t=' + Date.now(), { cache: 'no-store' });
    data = await res.json();
  } catch (e) {
    if (!data) document.getElementById('app').innerHTML = '<div class="loading">Kon de agenda niet laden. Heb je internet?</div>';
    return;
  }
  render();
}

renderDays();
load();
// Bij terugkeren naar de app: opnieuw laden en "wat nog komt" bijwerken
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
setInterval(render, 5 * 60000);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
